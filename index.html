<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Desk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Desk">
<meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E2622" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Look carried over from EverythingEverywhere: each section wears an anaesthesia syringe-label colour.
   Today = induction yellow, Study = antiemetic salmon, To-do = local-anaesthetic grey, Academics = opioid blue,
   OT = relaxant red, Roster = vasopressor violet, Cases = anticholinergic green, NBA = benzodiazepine orange. */
:root{
  --bg:#f1f2f4;--surface:#fff;--surface-2:#e9ebee;--line:#d9dce1;--sep:rgba(17,18,20,.14);--bar:rgba(241,242,244,.88);
  --fg:#121316;--fg-2:#3b3e45;--fg-3:#676b73;--on-label:#121316;--scrim:rgba(10,12,20,.4);
  --good:#2f6b3a;--good-soft:#dcecd2;--warn:#8a6100;--warn-soft:#fdf1c7;--danger:#b3261e;
  --k-acad:#5d7a2e;--k-exam:#c0264b;--k-posting:#2c6e8f;--k-duty:#7a4f9a;--k-case:#2d6a1e;
  --f-today:#ffd400;--i-today:#7a5a00;--s-today:#fff4bf;
  --f-study:#f9a08f;--i-study:#a3341f;--s-study:#ffe6e0;
  --f-todos:#b8bcc4;--i-todos:#474c55;--s-todos:#eceef1;
  --f-calendar:#14a5e2;--i-calendar:#06628c;--s-calendar:#d8f0fb;
  --f-ot:#ff4b55;--i-ot:#b0121d;--s-ot:#ffe0e2;
  --f-roster:#a47cc4;--i-roster:#5d3a7c;--s-roster:#efe5f7;
  --f-cases:#5fbd47;--i-cases:#2d6a1e;--s-cases:#e0f3d9;
  --f-nba:#ff8a1f;--i-nba:#a54b00;--s-nba:#ffe8d2;
  --f-backup:#d9dce1;--i-backup:#3b3e45;--s-backup:#e9ebee;
  --f-reminders:#4fd1b5;--i-reminders:#0f6e5c;--s-reminders:#d5f5ec;
  --f-advances:#7dd3fc;--f-music:#b39ddb;
  --font-body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --side:0px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0e10;--surface:#18191c;--surface-2:#222428;--line:#30333a;--sep:rgba(240,242,245,.12);--bar:rgba(13,14,16,.88);
  --fg:#f1f2f4;--fg-2:#c3c6cc;--fg-3:#8f939b;--scrim:rgba(0,0,0,.55);
  --good:#8fd09a;--good-soft:#1f3523;--warn:#f0be63;--warn-soft:#3d2d10;--danger:#ff8a80;
  --k-acad:#acd06a;--k-exam:#fb7f9b;--k-posting:#74b8d8;--k-duty:#c9a8e8;--k-case:#8bd776;
  --i-today:#ffd400;--s-today:#332a00;--i-study:#ffb3a3;--s-study:#3a1d17;--i-todos:#c9ccd2;--s-todos:#26282c;
  --i-calendar:#4cc2f2;--s-calendar:#0b2a38;--i-ot:#ff6b73;--s-ot:#3a1215;--i-roster:#c9a7e6;--s-roster:#2a1e36;
  --i-cases:#8bd776;--s-cases:#182e12;--i-nba:#ffa24d;--s-nba:#382210;--i-backup:#c3c6cc;--s-backup:#222428;--f-backup:#8f939b;--i-reminders:#4fd1b5;--s-reminders:#11332c;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:16.5px/1.38 var(--font-body);-webkit-font-smoothing:antialiased;padding-left:var(--side)}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--fg-3)}

/* nav bar */
.navbar{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep);padding-top:env(safe-area-inset-top)}
.nb-in{height:52px;max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.nb-t{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.avbtn{justify-self:start;width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;box-shadow:0 0 0 2px var(--bg),0 0 0 4.5px var(--label)}
.nb-r{justify-self:end;display:flex;gap:4px}
.iconbtn{width:38px;height:38px;border-radius:50%;color:var(--accent);display:grid;place-items:center}
.iconbtn:active{background:var(--surface-2)}
#banner{max-width:760px;margin:0 auto;padding:0 16px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin:10px 0 0;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.banner span{flex:1}

/* page */
.page{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:22px}
.lt-wrap{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.lt{align-self:flex-start;margin:0;background:var(--label);color:var(--on-label);font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1;letter-spacing:.01em;text-transform:uppercase;padding:7px 14px 4px;border-radius:7px}
.lt-sub{color:var(--fg-2);font-size:15px}
.sec{display:flex;flex-direction:column;gap:7px;min-width:0}
.sh{margin:0;padding:0 4px;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2);display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot{margin:0;padding:0 4px;font-size:13px;color:var(--fg-3)}

/* grouped list */
.group{background:var(--surface);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:11px 14px;width:100%;text-align:left;color:var(--fg);min-width:0}
.group>*+.row::before,.group>*+.rowwrap::before{content:"";position:absolute;top:0;right:0;left:14px;height:.5px;background:var(--sep)}
.rowwrap{position:relative;display:flex;align-items:center}
.rowwrap .row{flex:1}
button.row:active{background:var(--surface-2)}
.row.empty{color:var(--fg-3)}
.r-bar{align-self:stretch;width:4px;border-radius:2px;background:var(--c);flex:none}
.r-time{width:58px;flex:none;font-size:13px;color:var(--fg-2);font-weight:500;font-variant-numeric:tabular-nums}
.r-when{width:38px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.r-when b{font-family:var(--font-display);font-size:20px}
.r-when small{font-size:11px;color:var(--fg-3);text-transform:uppercase}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.r-t{font-size:16px;overflow-wrap:anywhere}
.r-s{font-size:13px;color:var(--fg-3);overflow-wrap:anywhere}
.r-k{flex:none;font-size:12px;font-weight:600;color:var(--c)}
.chev{width:8px;height:13px;flex:none;fill:none;stroke:var(--fg-3);stroke-width:2;stroke-linecap:round;opacity:.6}
.kv .r-l{flex:none}.kv .r-v{flex:1;text-align:right;color:var(--fg-3);overflow-wrap:anywhere}
.spec{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;text-transform:uppercase;flex:none}

/* cards */
.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;color:var(--fg);min-width:0}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.c-lab{font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--accent))}
.c-big{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1.05;text-transform:uppercase}
.c-t{font-family:var(--font-display);font-size:21px;font-weight:700}
.c-s{font-size:15px;color:var(--fg-2)}
.c-m{font-size:13px;color:var(--fg-3)}
.hero{background:var(--label);color:var(--on-label)}
.hero .c-lab,.hero .c-s,.hero .c-m{color:var(--on-label);opacity:.85}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px 12px 17px;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:inset 5px 0 0 var(--label)}
.s-l{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3)}
.s-n{font-family:var(--font-display);font-size:32px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.s-m{font-size:12px;color:var(--fg-3);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;align-self:flex-start}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.good{background:var(--good-soft);color:var(--good)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--surface);font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--surface);color:var(--danger)}
.btn.small{min-height:34px;padding:0 12px;font-size:15px;border-radius:9px}
.btn.wide{width:100%}
.btns{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:6px 8px;border-radius:7px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600;color:var(--accent)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;border-radius:999px;padding:7px 13px;background:var(--surface);color:var(--fg-2);font-size:14px;font-weight:500;white-space:nowrap}
.strip button[aria-pressed="true"]{background:var(--label);color:var(--on-label);font-weight:600}
.track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--label);border-radius:4px}
.mix-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 24px;gap:10px;align-items:center}
.mix-row .v{text-align:right;color:var(--fg-2);font-variant-numeric:tabular-nums}

/* check circles (to-do, OT, revision) */
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.check.on{background:var(--good);border-color:var(--good)}
.check.on::after{content:"";width:12px;height:7px;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:translate(0,-1px) rotate(-45deg)}
.done .r-t{text-decoration:line-through;color:var(--fg-3)}
.xbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;color:var(--fg-3);font-size:20px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cal-head h2{margin:0;font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent)}
.cal-head h2 span{color:var(--fg)}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-size:20px}
.calbox{background:var(--surface);border-radius:16px;padding:10px 8px 12px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.dw{text-align:center;font-size:11px;font-weight:600;color:var(--fg-3);padding:2px 0 6px}
.dc{padding:3px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.dc .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.dc.wk .n{color:var(--fg-3)}
.dc.today .n{color:var(--accent);font-weight:700}
.dc.sel .n{background:var(--fg);color:var(--bg);font-weight:600}
.dc.sel.today .n{background:var(--label);color:var(--on-label)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--fg-2);font-size:12px;padding:10px 8px 0;border-top:.5px solid var(--sep);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* roster */
.rlist{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dcard.past{opacity:.55}
.dcard.today{box-shadow:inset 0 0 0 2px var(--label)}
.dc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-h .dd{font-family:var(--font-display);font-weight:700;font-size:18px}
.dc-h .dd b{color:var(--accent);margin-right:4px}
.dc-h .cov{margin-left:auto;font-size:12px;color:var(--fg-3)}
.dc-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{background:var(--surface-2);border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.cell small{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell span{font-size:14px;overflow-wrap:anywhere}
.cell.mine{background:var(--label)}.cell.mine small,.cell.mine span{color:var(--on-label);font-weight:700}

/* NBA */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ngame{background:var(--surface);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nhead{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.nrow{display:flex;align-items:center;gap:8px;color:var(--fg-3);font-variant-numeric:tabular-nums;min-width:0}
.nrow.win{color:var(--fg);font-weight:700}
.nrow .tn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;overflow:hidden}
.nrow .tn em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.nrow .tn small{font-size:11px;font-weight:400;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow b{font-size:18px}.nrow:not(.win) b{font-weight:400}
.badge{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:hsl(var(--h) 55% 28%);background:hsl(var(--h) 70% 88%);border:2px solid hsl(var(--h) 55% 55%)}
.nrow.win .badge{background:hsl(var(--h) 60% 42%);color:#fff;border-color:hsl(var(--h) 60% 32%)}
@media (prefers-color-scheme:dark){.badge{color:hsl(var(--h) 80% 85%);background:hsl(var(--h) 40% 24%);border-color:hsl(var(--h) 50% 50%)}}
.st-r{width:20px;flex:none;text-align:right;color:var(--fg-3);font-size:14px;font-variant-numeric:tabular-nums}
.st-z{width:3px;align-self:stretch;border-radius:2px;background:var(--c,transparent);flex:none;margin-left:-6px}
.st-wl{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.st-p{flex:none;width:42px;text-align:right;color:var(--fg-3);font-size:14px;font-variant-numeric:tabular-nums}
.ld-v{flex:none;font-family:var(--font-display);font-size:20px;font-weight:700}

/* forms */
.field{gap:12px}
.field .f-l{flex:none;min-width:64px}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;text-align:right;height:26px;color:var(--fg-2);font-size:16px;outline:none}
.field input.left{text-align:left;color:var(--fg)}
.field select{-webkit-appearance:none;appearance:none;color:var(--accent);direction:rtl}
.tin{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--fg);outline:none}
.tin:focus{border-color:var(--accent)}
.quick{display:flex;gap:8px}
.quick .tin{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* dock */
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:25;transform:translateX(-50%);display:flex;gap:3px;padding:5px;border-radius:999px;background:var(--fg);box-shadow:0 10px 30px -8px rgba(0,0,0,.45);transition:transform .3s cubic-bezier(.2,.9,.25,1);max-width:calc(100vw - 20px)}
body.locked .dock{transform:translate(-50%,160%)}
.dock button{flex:none;height:44px;min-width:44px;padding:0 10px;border-radius:999px;color:var(--bg);opacity:.72;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.dock button span{display:none;white-space:nowrap}
.dock button[aria-current="page"]{background:var(--c);color:var(--on-label);opacity:1;padding:0 14px 0 10px}
.dock button[aria-current="page"] span{display:inline}

/* drawer */
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(310px,84vw);background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 16px) max(14px,env(safe-area-inset-left));transform:translateX(-105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility 0s linear .3s}
.drawer.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility 0s}
.prof{position:relative;overflow:hidden;background:#121316;color:#fff;border-radius:16px;padding:24px 16px 16px;display:flex;align-items:center;gap:12px;flex:none}
.prof::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,var(--f-today) 0 12.5%,var(--f-study) 0 25%,var(--f-todos) 0 37.5%,var(--f-calendar) 0 50%,var(--f-ot) 0 62.5%,var(--f-roster) 0 75%,var(--f-cases) 0 87.5%,var(--f-nba) 0)}
.prof{flex-direction:column;align-items:stretch;gap:12px}
.prof-top{display:flex;align-items:center;gap:14px}
.prof .av{width:64px;height:64px;border-radius:50%;background:var(--f-today);color:#121316;display:grid;place-items:center;font-family:var(--font-display);font-size:28px;font-weight:800;flex:none;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.18)}

/* sheet, toast */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:42;max-width:680px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top) - 24px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:16px 16px 0 0;padding:6px max(16px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s linear .32s}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sheet-in{display:flex;flex-direction:column;gap:16px}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;position:sticky;top:-6px;background:var(--bg);z-index:1}
.sheet-head h2{margin:0;font-size:17px;font-weight:600;text-align:center}
.link{color:var(--accent);font-size:17px;padding:8px 0;justify-self:start}
.link.strong{font-weight:600;justify-self:end}
.sheet-title{display:flex;flex-direction:column;gap:6px}
.sheet-title h3{margin:0;font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--bg);text-decoration:underline;padding-left:8px;font-weight:600}

.sbar{position:relative;display:flex;align-items:center}
.sbar svg{position:absolute;left:12px;width:18px;height:18px;fill:none;stroke:var(--fg-3);stroke-width:2;stroke-linecap:round;pointer-events:none}
.sbar input{width:100%;height:44px;border:0;border-radius:12px;background:var(--surface);color:var(--fg);padding:0 14px 0 38px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.sbar input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
#s-res{display:flex;flex-direction:column;gap:16px;min-height:60vh}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
/* OT table: every column kept, scrolls sideways; tick + procedure pinned left */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;background:var(--surface);border-radius:12px}
.otbl{border-collapse:separate;border-spacing:0;min-width:100%;font-size:15px}
.otbl th,.otbl td{padding:11px 12px;text-align:left;vertical-align:top;white-space:nowrap;border-bottom:.5px solid var(--sep);background:var(--surface)}
.otbl thead th{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);border-bottom:1px solid var(--line);padding-block:9px}
.otbl tbody tr:last-child>*{border-bottom:0}
.otbl .c-tick{position:sticky;left:0;z-index:2;width:50px;min-width:50px;padding:9px 6px 9px 12px}
.otbl .c-proc{position:sticky;left:50px;z-index:2;min-width:150px;max-width:190px;white-space:normal;font-weight:600;box-shadow:8px 0 8px -8px rgba(0,0,0,.35)}
.otbl .c-proc button{text-align:left;font-weight:600}
.otbl .c-wrap{white-space:normal;min-width:150px;max-width:230px}
.otbl .c-mono{font-family:var(--font-mono);font-size:13px}
.otbl tr.done>*{background:var(--good-soft)}
.otbl tr.done .c-proc button{text-decoration:line-through;color:var(--fg-3)}
.prog-row{display:flex;align-items:center;gap:16px}
.prog-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ring{position:relative;width:var(--sz);height:var(--sz);flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring:not(.smile) svg{transform:rotate(-90deg)}
.rg-tr{fill:none;stroke:var(--surface-2);stroke-width:7}
.rg-fg{fill:none;stroke:var(--label);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.25,1)}
.rg-v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:calc(var(--sz)*.3);color:var(--fg);font-variant-numeric:tabular-nums}
.rg-v small{font-size:.55em;margin-left:1px}
.sm-face{fill:var(--label)}.sm-eye{fill:var(--on-label)}.sm-mouth{fill:none;stroke:var(--on-label);stroke-width:3.6;stroke-linecap:round}
@keyframes smilepop{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:none}}
.ring.smile.anim svg{animation:smilepop .6s cubic-bezier(.2,.9,.25,1)}
.ring.late .rg-fg{stroke:var(--warn)}.ring.late .rg-tr{stroke:var(--warn-soft)}
.rg-v.stack{flex-direction:column;line-height:1}
.rg-v.stack small{font-family:var(--font-mono);font-size:calc(var(--sz)*.13);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);margin:2px 0 0}
.rem{display:flex;align-items:center;gap:14px;padding:12px 14px}
.rem .r-main{gap:3px}
.nudge{color:var(--warn);font-size:13.5px}
@media (prefers-reduced-motion:reduce){.rg-fg{transition:none}.ring.smile.anim svg{animation:none}}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.dc-g{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (min-width:900px){
  :root{--side:300px}
  .drawer{transform:none;visibility:visible;width:var(--side);transition:none}
  #dscrim,.dock,.avbtn{display:none}
  .page{padding-bottom:40px}
  .sheet{left:var(--side)}
  #toast{bottom:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Plum theme (Apoorva's palette) ----------
   #190019 · #2B124C · #522B5B · #854F6C · #DFB6B2 · #FBE4D8
   Section icons in the menu keep their own colours; everything else uses the palette. */
:root{
  --bg:#FBE4D8;--surface:#FFF6F1;--surface-2:#F5D9CF;--line:#E7C6BE;--sep:rgba(82,43,91,.16);--bar:rgba(251,228,216,.9);
  --fg:#190019;--fg-2:#522B5B;--fg-3:#854F6C;--scrim:rgba(25,0,25,.38);
  --accent:#522B5B;--accent-soft:#F1D0C8;--label:#2B124C;--on-label:#FBE4D8;--ring:#854F6C;--on-ring:#FBE4D8;
  --good:#3d6b45;--good-soft:#dcebd5;--warn:#9a5a12;--warn-soft:#fbe2c4;--danger:#a3243b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#190019;--surface:#2B124C;--surface-2:#3A1D5E;--line:#522B5B;--sep:rgba(223,182,178,.16);--bar:rgba(25,0,25,.9);
  --fg:#FBE4D8;--fg-2:#DFB6B2;--fg-3:#B48AA6;--scrim:rgba(0,0,0,.55);
  --accent:#DFB6B2;--accent-soft:#3D1F54;--label:#DFB6B2;--on-label:#190019;--ring:#DFB6B2;--on-ring:#190019;
  --good:#9fd8a8;--good-soft:#1f3a2a;--warn:#f0be63;--warn-soft:#3d2a10;--danger:#ff8fa3;
}}
.c-lab{color:var(--accent)!important}

.rg-fg,.ring:not(.late) .rg-fg{stroke:var(--ring)}

.sm-face{fill:var(--ring)}.sm-eye{fill:var(--on-ring)}.sm-mouth{stroke:var(--on-ring)}
.btn{color:var(--surface)}
@media (prefers-color-scheme:dark){.btn:not(.ghost):not(.danger){color:#190019}}
.avbtn{background:var(--label);color:var(--on-label);box-shadow:0 0 0 2px var(--bg),0 0 0 4.5px var(--ring)}
.prof{background:#2B124C;border:1px solid #522B5B}
@media (prefers-color-scheme:dark){.prof{background:#522B5B;border-color:#854F6C}}

/* ---------- Side menu: palette icons, soft fonts, glass marker on the current section ---------- */

  background:radial-gradient(120% 60% at 0% 0%,rgba(223,182,178,.55),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(133,79,108,.22),transparent 60%),var(--bg);
  --glass:rgba(255,255,255,.42);--glass-edge:rgba(255,255,255,.75);--glass-shade:rgba(82,43,91,.18);--tile:#F1D0C8;--tile-ink:#522B5B;--tile-on:#2B124C;--tile-on-ink:#FBE4D8}

  --glass:rgba(251,228,216,.10);--glass-edge:rgba(251,228,216,.28);--glass-shade:rgba(0,0,0,.45);--tile:#3D1F54;--tile-ink:#DFB6B2;--tile-on:#DFB6B2;--tile-on-ink:#190019}}

  background:linear-gradient(135deg,var(--glass),rgba(255,255,255,.06))!important;
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
  border-color:var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 -1px 0 rgba(255,255,255,.08),0 8px 22px -12px var(--glass-shade),0 0 0 4px rgba(223,182,178,.18)!important;overflow:hidden}
.ditem[aria-current="page"]::before{content:"";position:absolute;inset:0 0 55% 0;border-radius:12px 12px 40% 40%/12px 12px 10px 10px;background:linear-gradient(180deg,rgba(255,255,255,.45),transparent);opacity:.55;pointer-events:none}

@keyframes menusheen{from{left:-50%}to{left:130%}}

/* no bottom bar: navigation lives in the side menu */

/* ==========================================================================
   Capsule theme (Apoorva's tiles + palette) — overrides the plum layer above.
   Palette: #1C1E3A navy · #40263A aubergine · #6D324F wine · #B85C4A rust · #E89F6E apricot · #F7E6C4 cream
   ========================================================================== */
:root{
  --bg:#F7E6C4;--surface:#FFF6E6;--surface-2:#F0D8B4;--line:#E3C59C;--sep:rgba(64,38,58,.14);--bar:rgba(247,230,196,.9);
  --fg:#1C1E3A;--fg-2:#40263A;--fg-3:#7B5560;--scrim:rgba(28,30,58,.4);
  --accent:#6D324F;--accent-soft:#F1D3BC;--label:#40263A;--on-label:#F7E6C4;--ring:#B85C4A;--on-ring:#F7E6C4;
  --good:#3f6b45;--good-soft:#dfe9cf;--warn:#a2511f;--warn-soft:#f6d9b8;--danger:#9e2b3c;
  --t1:#E89F6E;--t1i:#1C1E3A;--t2:#B85C4A;--t2i:#F7E6C4;--t3:#6D324F;--t3i:#F7E6C4;--t4:#40263A;--t4i:#F7E6C4;--t5:#1C1E3A;--t5i:#F7E6C4;
  --tile-shadow:0 10px 18px -10px rgba(28,30,58,.55),0 2px 4px -2px rgba(28,30,58,.25);
  --tile-bevel:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.14);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1C1E3A;--surface:#26284B;--surface-2:#32345C;--line:#43456E;--sep:rgba(247,230,196,.12);--bar:rgba(28,30,58,.9);
  --fg:#F7E6C4;--fg-2:#E9C9A6;--fg-3:#B89C97;--scrim:rgba(0,0,0,.55);
  --accent:#E89F6E;--accent-soft:#3A2E48;--label:#E89F6E;--on-label:#1C1E3A;--ring:#E89F6E;--on-ring:#1C1E3A;
  --good:#a8d6a0;--good-soft:#25402e;--warn:#f0b56f;--warn-soft:#4a3020;--danger:#ff9aa8;
  --t4:#57324F;--t5:#3A3D6B;
  --tile-shadow:0 12px 20px -10px rgba(0,0,0,.75),0 2px 4px -2px rgba(0,0,0,.5);
}}
/* capsules everywhere */
.btn,.lt,.pill,.strip button,.seg,.seg button{border-radius:999px}
.btn{box-shadow:var(--tile-shadow),var(--tile-bevel)}
.btn.ghost,.btn.danger{box-shadow:0 6px 12px -8px rgba(28,30,58,.35)}

.stats .stat .s-n{color:inherit!important}

/* side menu: staggered capsule tiles */
.drawer{background:radial-gradient(120% 60% at 0% 0%,rgba(232,159,110,.35),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(109,50,79,.25),transparent 60%),var(--bg)!important}
@media (prefers-color-scheme:dark){.drawer{background:radial-gradient(120% 60% at 0% 0%,rgba(109,50,79,.55),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(184,92,74,.25),transparent 60%),var(--bg)!important}}
.prof{background:linear-gradient(140deg,#1C1E3A,#40263A)!important;border:0!important;border-radius:26px;box-shadow:var(--tile-shadow),var(--tile-bevel)}
@media (prefers-color-scheme:dark){.prof{background:linear-gradient(140deg,#40263A,#6D324F)!important}}
.prof::before{background:linear-gradient(90deg,#1C1E3A,#40263A,#6D324F,#B85C4A,#E89F6E,#F7E6C4)!important}
.prof .av{background:#E89F6E!important;color:#1C1E3A!important}
.pl svg{stroke:#E89F6E!important}
.dnav{gap:9px}
.dnav .sh{margin:10px 0 0;padding:0 14px}
.ditem{--tf:var(--t1);--ti:var(--t1i);background:var(--tf)!important;color:var(--ti)!important;border-radius:999px!important;border:0!important;min-height:52px;padding:6px 18px 6px 8px!important;font-weight:700!important;font-size:16px;width:100%;box-shadow:var(--tile-shadow),var(--tile-bevel)!important;transition:transform .2s cubic-bezier(.2,.9,.25,1),box-shadow .2s}

.ditem svg{background:rgba(255,255,255,.18)!important;color:inherit!important;border-radius:999px!important;width:38px!important;height:38px!important;padding:8px!important}
.ditem small{background:rgba(255,255,255,.22)!important;color:inherit!important;opacity:1}

  --good:#2f6b4f;--good-soft:#d8efdf;--warn:#8a5a14;--warn-soft:#f6ead2;--danger:#9b3b3b;
  --tile-shadow:0 6px 14px -10px rgba(5,31,32,.35),0 1px 2px rgba(5,31,32,.06);

}

  --bg:#051F20;--surface:#0B2B26;--surface-2:#163832;--line:#235347;--sep:rgba(218,241,222,.10);--bar:rgba(5,31,32,.9);
  --fg:#DAF1DE;--fg-2:#B7D6BF;--fg-3:#8EB69B;--scrim:rgba(0,0,0,.55);
  --accent:#8EB69B;--accent-soft:#163832;--label:#8EB69B;--on-label:#051F20;--ring:#8EB69B;--on-ring:#051F20;
  --good:#9fd3ae;--good-soft:#173a2c;--warn:#e8c27a;--warn-soft:#3a3018;--danger:#f0a3a3;

/* ==========================================================================
   "Sage & Oat" — friendly, clean (v4.2). Ideas: warm neutral background instead of stark white,
   soft pastel tints per kind of card, rounded friendly type, sentence case, gentle shadows.
   Fonts: Plus Jakarta Sans (headings, labels, menu) + Inter (body text).
   ========================================================================== */
:root{
  --bg:#F6F3EC;--surface:#FFFFFF;--surface-2:#F2EFE7;--line:#E7E2D7;--sep:rgba(31,42,36,.08);--bar:rgba(246,243,236,.86);
  --fg:#1F2A24;--fg-2:#4A5650;--fg-3:#8A938D;--scrim:rgba(20,26,23,.35);
  --accent:#3E7B5E;--accent-soft:#E3EFE6;--label:#3E7B5E;--on-label:#FFFFFF;--ring:#3E7B5E;--on-ring:#FFFFFF;
  --t-sage:#E3EFE6;--t-sage-i:#2F6B4F;--t-peach:#FBE9DD;--t-peach-i:#9A5A33;--t-sky:#E2EEF8;--t-sky-i:#2F5E86;
  --t-lav:#ECE7F6;--t-lav-i:#5B4A8A;--t-butter:#FBF2D4;--t-butter-i:#7A6214;--t-rose:#F8E4E6;--t-rose-i:#93404B;
  --tile-shadow:0 1px 2px rgba(31,42,36,.04),0 8px 24px -14px rgba(31,42,36,.18);--tile-bevel:none;
  --f-head:"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;--font-body:"Inter",-apple-system,system-ui,sans-serif;
  --font-display:"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E2622;--bar:rgba(30,38,34,.86);--scrim:rgba(0,0,0,.5);
  --tile-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 26px -14px rgba(0,0,0,.6)}
  body{background:#1E2622}}
body{background:var(--bg)}
/* type */
.card,.c-s,.c-m,.r-t,.r-s,.field,.foot{font-family:var(--font-body)}
.nb-t,.hello-t,.lt,.c-big,.c-t,.s-n,.btn,.ditem,.sh,.c-lab,.prof b,.bk-info b,.read-i b,.pill,.seg button{font-family:var(--f-head)!important}
.c-lab,.sh,.s-l,.bk-part,.otbl thead th,.nhead,.cell small,.r-when small{text-transform:none!important;letter-spacing:0!important}
.c-lab{font-size:13px!important;font-weight:600!important;color:var(--fg-3)!important}
.sh{font-size:15px!important;font-weight:700!important;color:var(--fg)!important;padding:0 4px!important}
.bk-part{font-family:var(--f-head);font-size:12.5px!important;font-weight:700!important;color:var(--fg-3)!important}
.c-big{text-transform:none!important;font-size:22px!important;font-weight:700!important;letter-spacing:-.01em!important;line-height:1.2!important}
.c-t,.s-n{font-weight:700!important;letter-spacing:-.01em}
.btn{text-transform:none!important;letter-spacing:0!important;font-size:15.5px!important;font-weight:600!important;border-radius:999px!important;background:var(--accent)!important;color:#fff!important;box-shadow:none!important}
.btn.ghost{background:var(--accent-soft)!important;color:var(--accent)!important}
/* page headings: friendly, no boxed labels */
.lt{background:none!important;color:var(--fg)!important;box-shadow:none!important;padding:0!important;text-transform:none!important;font-size:27px!important;font-weight:700!important;letter-spacing:-.02em!important;line-height:1.15!important;border-radius:0!important}
.lt-sub{color:var(--fg-3)!important;font-size:14.5px!important}
.eyebrow{font-family:var(--f-head)!important;text-transform:none!important;letter-spacing:0!important;font-size:13px!important;color:var(--fg-3)!important;font-weight:600!important}
.hello-t{font-weight:700!important;font-size:27px!important;letter-spacing:-.02em!important;color:var(--fg)!important}
.hello-d{color:var(--fg-3)!important}.hello-s{color:var(--fg-2)!important}
.nb-t{color:var(--fg)!important;font-weight:700!important}
.navbar,.navbar button,.navbar svg{color:var(--fg)!important}
/* cards */
.card{background:var(--surface)!important;border:0!important;border-radius:22px!important;box-shadow:var(--tile-shadow)!important;color:var(--fg)!important}
.hero{background:var(--t-sage)!important;color:var(--fg)!important}
.hero .c-lab{color:var(--t-sage-i)!important}.hero .c-big{color:var(--fg)!important}.hero .c-s{color:var(--fg-2)!important}.hero .c-m{color:var(--t-sage-i)!important}
.readc{background:var(--t-peach)!important}.readc .c-lab,.readc .c-m{color:var(--t-peach-i)!important}
.read-i{background:rgba(255,255,255,.7)!important;border-radius:16px!important}.read-i small{color:var(--t-peach-i)!important}
.card[style*="k-exam"]{background:var(--t-lav)!important}.card[style*="k-exam"] .c-lab{color:var(--t-lav-i)!important}
.wx,.card:has(.wx-acts){background:var(--t-sky)!important}.card:has(.wx-acts) .c-lab{color:var(--t-sky-i)!important}
.stats .stat,.stats .stat:nth-child(n){background:var(--surface-2)!important;border-radius:16px!important;color:var(--fg)!important}
.group{border-radius:22px!important;overflow:hidden;box-shadow:var(--tile-shadow)!important;border:0!important}
.check.on{background:var(--accent)!important;border-color:var(--accent)!important}
.track{background:var(--surface-2)!important}.fill{background:var(--accent)!important}
/* side menu */
.drawer{background:var(--bg)!important;border-right:1px solid var(--line)!important}
.drawer .sh{font-size:12.5px!important;color:var(--fg-3)!important;font-weight:600!important}
.ditem,.ditem[data-tab]{background:transparent!important;box-shadow:none!important;color:var(--fg-2)!important;text-transform:none!important;letter-spacing:0!important;font-size:15.5px!important;font-weight:500!important;border-radius:16px!important;min-height:46px!important;transform:none!important}
.ditem[aria-current="page"],.ditem[aria-current="page"][data-tab]{background:var(--surface)!important;color:var(--fg)!important;font-weight:700!important;box-shadow:var(--tile-shadow)!important}
.ditem[aria-current="page"]::after,.ditem::after{display:none!important}
.ditem svg,.ditem[data-tab] svg,.ditem[aria-current="page"] svg{width:34px!important;height:34px!important;padding:7px!important;border-radius:12px!important;background:var(--t-sage)!important;color:var(--t-sage-i)!important}
.ditem[data-tab="today"] svg{background:var(--t-butter)!important;color:var(--t-butter-i)!important}
.ditem[data-tab="reminders"] svg,.ditem[data-tab="backup"] svg{background:var(--t-rose)!important;color:var(--t-rose-i)!important}
.ditem[data-tab="study"] svg,.ditem[data-tab="todos"] svg{background:var(--t-peach)!important;color:var(--t-peach-i)!important}
.ditem[data-tab="calendar"] svg,.ditem[data-tab="advances"] svg{background:var(--t-lav)!important;color:var(--t-lav-i)!important}
.ditem[data-tab="ot"] svg,.ditem[data-tab="roster"] svg,.ditem[data-tab="cases"] svg{background:var(--t-sky)!important;color:var(--t-sky-i)!important}
.ditem small,.ditem[aria-current="page"] small{background:var(--accent-soft)!important;color:var(--accent)!important;font-weight:600!important}
.prof{background:var(--surface)!important;color:var(--fg)!important;box-shadow:var(--tile-shadow)!important;border-radius:22px!important}
.prof *{color:var(--fg-2)}.prof b{color:var(--fg)!important;font-weight:700!important}
.prof .btn,.prof .btn.ghost{background:var(--accent-soft)!important;color:var(--accent)!important}
.avbtn{background:var(--t-sage)!important;color:var(--t-sage-i)!important}
#toast,.toast{background:#1F2A24!important;color:#F6F3EC!important;border-radius:999px!important}
/* dark mode: same friendly cards on a deep warm background */
@media (prefers-color-scheme:dark){
  .nb-t,.navbar,.navbar button,.navbar svg,.hello-t,.lt{color:#F1EEE6!important}
  .hello-d,.lt-sub,.eyebrow,.drawer .sh{color:#9AA59F!important}.hello-s{color:#C9CFCB!important}
  #page>.sh,.sec>.sh{color:#F1EEE6!important}#page>.foot,.sec>.foot{color:#9AA59F!important}
  .drawer{background:#19201D!important;border-right-color:rgba(255,255,255,.06)!important}
  .ditem,.ditem[data-tab]{color:#C9CFCB!important}
  .ditem[aria-current="page"],.ditem[aria-current="page"][data-tab]{background:#FFFFFF!important;color:#1F2A24!important}
  .prof{background:#FFFFFF!important}
  #toast,.toast{background:#F6F3EC!important;color:#1F2A24!important}
}
.ditem,.ditem[data-tab]{border:0!important;outline:0}
.prof::before,.prof::after{display:none!important}
.navbar .avbtn,.navbar .avbtn *{color:var(--t-sage-i)!important}
/* sheets: always light card colours so text stays readable in dark mode */
.sheet,#sheet{background:#FFFFFF!important;color:#1F2A24!important}

.sheet .group,.sheet .field,.sheet input,.sheet textarea,.sheet select{background:#F6F3EC!important}
.sheet .bk-list{border-top-color:#E7E2D7!important}
.sheet .ring circle:first-child{stroke:#ECE8DF}
.sheet .sheet-head{background:#FFFFFF!important;color:#1F2A24!important;border-bottom-color:#E7E2D7!important}
.sheet .sheet-head .link{color:#3E7B5E!important}

<script>
'use strict';
const APP_VERSION = '5.5 · reader';
const KEY = 'studydesk.v1';
const DATA_FILES = ['cases', 'schedule', 'ot', 'nba', 'advances', 'books', 'topics', 'music'];

/* ---------- icons ---------- */
const IC = {
  today: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  study: '<path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5"/><path d="M8 7h7M8 11h5"/>',

  calendar: '<path d="M12 6.5C10 5 7 4.5 3.5 5v13.5c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5V20"/>',

  cases: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M7.5 14h2l1.5-3 2 5 1.5-2h2"/>',
  music: '<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  nba: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"/>',
  advances: '<path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/>',
  reminders: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',

const svg = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const CHEV = '<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5l5 5-5 5"/></svg>';
const SECS = {
  today: 'Today', study: 'Study', todos: 'To-do', calendar: 'Academics', ot: 'OT list',
  roster: 'Duty roster', cases: 'SLCM cases', nba: 'NBA', music: 'Music', advances: 'New advances', reminders: 'Reminders', backup: 'Backup & settings'
};
const DOCK = ['today', 'study', 'todos', 'calendar', 'ot'];
const DOCK_LABEL = { today: 'Today', study: 'Study', todos: 'To-do', calendar: 'Acad', ot: 'OT' };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const dayOf = isoStr => isoOf(new Date(isoStr));
const dt = s => new Date(s + 'T00:00:00');
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOWL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const dShort = s => +s.slice(8) + ' ' + MON[+s.slice(5, 7) - 1];
const dDow = s => DOW[(dt(s).getDay() + 6) % 7];

const relDay = s => { const n = daysUntil(s); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : n > 1 ? 'In ' + n + ' days' : -n + ' days ago'; };
const ago = isoStr => { const n = -daysUntil(dayOf(isoStr)); return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; };

const byId = (arr, id) => arr.find(x => x.id === id);

/* ---------- personal data (on this phone) ---------- */
const banners = { save: null, info: null };
function blank() {
  return { version: 2, subjects: [], topics: [], log: [], todos: [], events: [], otDone: {}, private: null, reminders: [], remDone: {}, remSeeded: {}, profile: {}, loc: null, weather: null, advSeen: '', advSaved: {}, bookDone: {}, myCases: {},
    settings: { weatherOn: true, backupLine: true, myName: '', countdownOn: true, readOn: true, examLabel: 'MD final exams', examDate: '2027-12-20', revisionsOn: true, intervals: [1, 3, 7, 14, 30] },
    meta: { lastExport: null, created: nowISO() } };
}
function normalise(s) {
  const b = blank();
  return { version: 2, subjects: s.subjects || [], topics: s.topics || [], log: s.log || [], todos: s.todos || [],
    events: s.events || [], otDone: s.otDone || {}, private: s.private || null,
    reminders: s.reminders || [], remDone: s.remDone || {}, remSeeded: s.remSeeded || {}, profile: s.profile || {}, loc: s.loc || null, weather: s.weather || null, advSeen: s.advSeen || '', advSaved: s.advSaved || {}, bookDone: s.bookDone || {}, myCases: s.myCases || {}, sync: s.sync || null, active: s.active || null,
    settings: { ...b.settings, ...(s.settings || {}) }, meta: { ...b.meta, ...(s.meta || {}) } };
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { banners.info = "This phone isn't letting the app store data right now, so changes won't be kept. Try opening the app from the home screen."; return blank(); }
  if (!raw) return blank();
  try { return normalise(JSON.parse(raw)); } catch (e) {
    try { localStorage.setItem(KEY + '.unreadable-' + Date.now(), raw); } catch (_) {}
    banners.info = "Your saved data couldn't be read, so the app started empty. A copy was kept aside. Use Backup → Restore to bring back your last backup.";
    return blank();
  }
}
let state = load();
function save() {
  try { stampAll(); } catch (_) {}
  try {
    const s = JSON.stringify(state);
    localStorage.setItem(KEY, s);
    if (localStorage.getItem(KEY) !== s) throw new Error('check failed');
    if (banners.save) { banners.save = null; renderBanner(); }
    return true;
  } catch (e) {
    banners.save = "Couldn't save. Your last change is only on screen and will be lost when the app closes. Try again, or export a backup from Backup & settings.";
    renderBanner(); return false;
  }
}
function commit(msg, undo) { const ok = save(); render(); if (ok && msg) toast(msg, undo); if (ok) syncSoon(); return ok; }

/* ---------- shared data (from the data folder on GitHub) ---------- */
const D = {}; const dataStatus = {};
DATA_FILES.forEach(f => {
  try { const c = JSON.parse(localStorage.getItem('studydesk.data.' + f) || 'null'); if (c) { D[f] = c.data; dataStatus[f] = { from: 'saved', at: c.at }; } } catch (_) {}
  if (!dataStatus[f]) dataStatus[f] = { from: 'none' };
});
async function loadData(manual) {
  let failed = 0;
  await Promise.all(DATA_FILES.map(async f => {
    try {
      const r = await fetch('data/' + f + '.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      D[f] = j; dataStatus[f] = { from: 'network', at: nowISO() };
      try { localStorage.setItem('studydesk.data.' + f, JSON.stringify({ at: nowISO(), data: j })); } catch (_) {}
    } catch (e) { failed++; if (dataStatus[f].from === 'network') dataStatus[f].from = 'saved'; }
  }));
  render();
  if (manual) toast(failed ? "Couldn't reach GitHub. Showing the last saved copy." : 'Up to date ✓');
}
const CASES = () => (D.cases && D.cases.items) || [];
const SCHED = () => (D.schedule && D.schedule.items) || [];
const SESSION_TIME = () => (D.schedule && D.schedule.sessionTime) || '';
const BOOKS = () => (D.books && D.books.books) || [];
let bookOpen = null;
function bookStats(b) { const n = b.chapters.length; const d = b.chapters.filter(c => state.bookDone[b.id + '|' + c.n]).length; return { n, d }; }
function booksSection() {
  const B = BOOKS();
  let h = `<div class="sec"><h2 class="sh">Textbooks</h2>`;
  if (!B.length) return h + `<div class="card"><span class="c-s">Tell Claude which textbook (and edition) you're reading. Its chapters show up here for you to tick off as you finish them.</span></div></div>`;
  h += `<div class="bktiles">` + B.map(b => { const x = bookStats(b); const next = b.chapters.find(c => !state.bookDone[b.id + '|' + c.n]);
    return `<button class="card bkt" type="button" data-act="book-open" data-id="${esc(b.id)}">${ring(x.d, x.n, 52, 'bk-' + b.id)}<span class="bk-info"><b>${esc(b.title)}</b><span>${x.d} of ${x.n} chapters</span>${next ? `<small>Next: ${esc(next.title)}</small>` : '<small>Finished 🎉</small>'}</span>${CHEV}</button>`; }).join('') + `</div>`;
  return h + `</div>`;
}
function bookSheet(id) {
  const b = BOOKS().find(x => x.id === id); if (!b) return; const x = bookStats(b); const keep = sheetOpen() && $('sheet-body').querySelector('.bk-list') ? $('sheet').scrollTop : null;
  let last = null;
  const rows = b.chapters.map(c => { const k = b.id + '|' + c.n; const on = !!state.bookDone[k];
    let ph = ''; if (c.part && c.part !== last) { last = c.part; ph = `<div class="bk-part">${esc(c.part)}</div>`; }
    return ph + `<button class="bk-row${on ? ' done' : ''}" type="button" data-act="book-tick" data-id="${esc(k)}"><span class="check${on ? ' on' : ''}" aria-hidden="true"></span><span class="bk-n">${esc(String(c.n))}</span><span class="bk-t">${esc(c.title)}</span></button>`; }).join('');
  openSheet(`<div class="sheet-in"><div class="sheet-head"><span></span><h2>Chapters</h2><button type="button" class="link strong" data-act="close">Done</button></div>
    <div class="bk-sum">${ring(x.d, x.n, 56, 'bks-' + b.id)}<span class="bk-info"><b>${esc(b.title)}</b><span>${x.d} of ${x.n} chapters done</span><small>${esc([b.edition, b.authors].filter(Boolean).join(' · '))}</small></span></div>
    <div class="bk-list">${rows}</div></div>`);
  if (keep !== null) $('sheet').scrollTop = keep;
}
const OTL = () => (D.ot && D.ot.items) || [];
const ROSTER = () => (state.private && state.private.roster && state.private.roster.days) || [];
const RCOLS = () => (state.private && state.private.roster && state.private.roster.cols) || [];
const presenters = k => (state.private && state.private.presenters && state.private.presenters[k]) || '';
function otInfo(id) {
  const v = state.private && state.private.ot && state.private.ot[id];
  if (!v) return {};
  if (typeof v === 'string') { const p = v.split(' · '); return { patient: p[0] || '', age: p[1] || '', uhid: p[2] || '' }; }
  return v;
}
const otName = id => { const i = otInfo(id); return [i.patient, i.age, i.uhid].filter(Boolean).join(' · '); };
const caseUhid = n => (state.private && state.private.cases && state.private.cases[n]) || '';

/* ---------- roster helpers ---------- */
const cellHas = (cell, n) => cell.split('/').some(t => t.trim().toLowerCase() === n);
function dutiesFor(k) {
  const n = state.settings.myName.trim().toLowerCase();
  if (!n) return [];
  const r = ROSTER().find(x => x.date === k);
  return r ? r.p.map((c, i) => cellHas(c, n) ? RCOLS()[i] : null).filter(Boolean) : [];
}

/* ---------- study / revision ---------- */
function topicDays(id) { return [...new Set(state.log.filter(l => l.topicId === id).map(l => dayOf(l.date)))].sort(); }
function revStatus(t) {
  const days = topicDays(t.id); const iv = state.settings.intervals;
  if (!days.length) return { state: 'new' };
  const last = days[days.length - 1];
  if (days.length > iv.length) return { state: 'complete', last, step: days.length };
  const due = addDays(last, iv[days.length - 1]);
  return { state: due <= today() ? 'due' : 'scheduled', due, last, step: days.length };
}
function statusLine(st) {
  const total = state.settings.intervals.length;
  if (st.state === 'new') return 'Not studied yet';
  if (st.state === 'complete') return 'All ' + total + ' revisions done · last ' + ago(st.last + 'T12:00:00');
  if (st.state === 'due') return 'Ready to revise · last studied ' + ago(st.last + 'T12:00:00');
  return 'Next revision ' + dShort(st.due) + ' · revision ' + st.step + ' of ' + total;
}
const dueTopics = () => state.settings.revisionsOn ? state.topics.map(t => ({ t, st: revStatus(t) })).filter(x => x.st.state === 'due').sort((a, b) => a.st.due.localeCompare(b.st.due)) : [];

/* ---------- calendar items ---------- */
const KINDS = {
  acad: { label: 'Academic', color: 'var(--k-acad)' }, posting: { label: 'Posting', color: 'var(--k-posting)' },
  exam: { label: 'Exam', color: 'var(--k-exam)' }, duty: { label: 'Duty', color: 'var(--k-duty)' }, case: { label: 'Case', color: 'var(--k-case)' }
};
let REG = [];
const reg = it => (REG.push(it), REG.length - 1);
function itemsFor(k) {
  const out = [];
  SCHED().filter(x => x.date === k).forEach(x => out.push({ date: k, kind: x.kind in KINDS ? x.kind : 'acad', title: x.session, sub: x.topic || presenters(k), topic: x.topic, who: presenters(k), time: (SESSION_TIME().split(' ')[0] || '') + ' AM', src: 'Department program' }));
  dutiesFor(k).forEach(l => out.push({ date: k, kind: 'duty', title: 'Emergency duty', sub: l, time: 'Duty', src: 'Duty roster', role: l }));
  CASES().filter(c => c.date === k).forEach(c => out.push({ date: k, kind: 'case', title: c.procedure, sub: c.specialty + (c.or ? ' · ' + c.or : ''), time: 'Case', caseN: c.n }));
  state.events.filter(e => e.date === k).forEach(e => out.push({ date: k, kind: e.kind, title: e.text, sub: '', time: 'All day', evId: e.id }));
  return out;
}
function rowHTML(it, withDate) {
  const id = reg(it); const K = KINDS[it.kind] || KINDS.acad;

}

/* ---------- UI state ---------- */
let tab = SECS[location.hash.slice(1)] ? location.hash.slice(1) : 'today';
const now0 = new Date();
let view = { y: now0.getFullYear(), m: now0.getMonth() };
let sel = today();
let searchHitDate = null;
let rmode = 'mine', nbaSub = 'scores', nbaDay = null, otDay = null, showDone = false;
const collapsed = new Set();

/* ---------- pages ---------- */
const head = (title, sub, eyebrow) => `<div class="lt-wrap">${eyebrow ? `<span class="eyebrow">${esc(eyebrow)}</span>` : ''}<h1 class="lt">${esc(title)}</h1>${sub ? `<span class="lt-sub">${sub}</span>` : ''}</div>`;
const stat = (l, n, m) => `<div class="stat"><span class="s-l">${l}</span><span class="s-n">${n}</span>${m}</div>`;

function wxKind(code, day) { if (code >= 95) return 'storm'; if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow'; if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain'; if (code === 45 || code === 48) return 'fog'; if (code === 3) return 'cloud'; if (code === 2) return day ? 'partly' : 'partlyn'; return day ? 'sun' : 'moon'; }
function wxArt(kind) {
  const sun = `<g class="wa-sun"><circle cx="34" cy="30" r="12" fill="#F6B92B"/><g class="wa-rays" stroke="#F6B92B" stroke-width="3.2" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a => `<line x1="34" y1="12" x2="34" y2="7" transform="rotate(${a} 34 30)"/>`).join('')}</g></g>`;
  const moon = `<path d="M40 16a14 14 0 1 0 10 22 11 11 0 0 1-10-22z" fill="#F4E6B0"/><circle cx="20" cy="16" r="1.2" fill="#fff"/><circle cx="56" cy="12" r="1" fill="#fff"/><circle cx="62" cy="30" r="1.2" fill="#fff"/>`;
  const cloud = (x, y, f) => `<g class="wa-cloud" transform="translate(${x} ${y})"><path d="M14 30h34a10 10 0 0 0 0-20 14 14 0 0 0-26-4A11 11 0 0 0 14 30z" fill="${f}"/></g>`;
  const drops = `<g class="wa-rain" stroke="#4C8FD6" stroke-width="2.6" stroke-linecap="round">${[22, 34, 46, 58].map((x, i) => `<line x1="${x}" y1="46" x2="${x - 3}" y2="54" style="animation-delay:${i * .25}s"/>`).join('')}</g>`;
  const flakes = `<g class="wa-snow" fill="#8FB8E0">${[24, 36, 48, 60].map((x, i) => `<circle cx="${x}" cy="50" r="2.2" style="animation-delay:${i * .3}s"/>`).join('')}</g>`;
  const bolt = `<path class="wa-bolt" d="M40 42l-6 10h5l-3 9 9-12h-5l3-7z" fill="#F6C344"/>`;
  const fog = `<g stroke="#9AA8B2" stroke-width="3" stroke-linecap="round" class="wa-fog"><line x1="12" y1="40" x2="62" y2="40"/><line x1="18" y1="48" x2="68" y2="48"/><line x1="10" y1="56" x2="54" y2="56"/></g>`;
  const inner = { sun, moon, partly: sun + cloud(14, 14, '#FFFFFF'), partlyn: moon + cloud(14, 14, '#E8EEF0'), cloud: cloud(4, 6, '#B8C4CD') + cloud(16, 14, '#FFFFFF'), rain: cloud(10, 4, '#9FB0BF') + drops, snow: cloud(10, 4, '#B8C4CD') + flakes, storm: cloud(10, 2, '#8494A3') + bolt + drops, fog: cloud(10, 2, '#B8C4CD') + fog }[kind] || sun;

}
function profWeather() {

  if (!L || !W || !W.current) return `<button class="pwx" type="button" data-act="${L ? 'wx-refresh' : 'wx-locate'}"><span class="pwx-t"><b>Weather</b><span>${L ? 'Tap to load' : 'Tap to add your location'}</span></span></button>`;

  return `<button class="pwx pwx-${k}" type="button" data-act="wx-sheet">${wxArt(k)}<span class="pwx-t"><b>${Math.round(c.temperature_2m)}°</b><span>${esc(txt)}${d.temperature_2m_max ? ' · ' + Math.round(d.temperature_2m_max[0]) + '° / ' + Math.round(d.temperature_2m_min[0]) + '°' : ''}</span><small>${esc(L.place || '')}</small></span></button>`;
}
function wxChip() {

}

}
function pageToday() {
  const t = today(); const P = profile(); const gi = { 'Good morning': '☀️', 'Good afternoon': '🌤️', 'Good evening': '🌇', 'Good night': '🌙' }[greeting()] || '';
  let h = `<div class="hello"><div class="hello-row"><span class="hello-d">${esc(dLong(t))}</span>${wxChip()}</div><h1 class="hello-t">${esc(greeting())}${P.name ? ', ' + esc(P.name.split(' ')[0]) : ''} <span aria-hidden="true">${gi}</span></h1><span class="hello-s">${esc(helloLine())}</span></div>`;
  const S0 = state.settings || {}; const up = SCHED().filter(x => x.date >= t).sort((a, b) => a.date.localeCompare(b.date))[0];

/* ---------- location & weather ----------
   Off until turned on. Location comes from the phone (asks permission); place name from BigDataCloud's free client-side
   reverse geocoding (device's current position only), weather from Open-Meteo (free, no key). Coordinates kept on this phone, rounded to ~1 km. */
const WMO = { 0: ['☀️', 'Clear'], 1: ['🌤️', 'Mostly clear'], 2: ['⛅', 'Partly cloudy'], 3: ['☁️', 'Cloudy'], 45: ['🌫️', 'Fog'], 48: ['🌫️', 'Fog'],
  51: ['🌦️', 'Light drizzle'], 53: ['🌦️', 'Drizzle'], 55: ['🌧️', 'Heavy drizzle'], 56: ['🌧️', 'Freezing drizzle'], 57: ['🌧️', 'Freezing drizzle'],
  61: ['🌦️', 'Light rain'], 63: ['🌧️', 'Rain'], 65: ['🌧️', 'Heavy rain'], 66: ['🌧️', 'Freezing rain'], 67: ['🌧️', 'Freezing rain'],
  71: ['🌨️', 'Light snow'], 73: ['🌨️', 'Snow'], 75: ['🌨️', 'Heavy snow'], 77: ['🌨️', 'Snow grains'],
  80: ['🌦️', 'Light showers'], 81: ['🌧️', 'Showers'], 82: ['⛈️', 'Heavy showers'], 85: ['🌨️', 'Snow showers'], 86: ['🌨️', 'Snow showers'],
  95: ['⛈️', 'Thunderstorm'], 96: ['⛈️', 'Thunderstorm with hail'], 99: ['⛈️', 'Thunderstorm with hail'] };
const wmo = (code, day) => { const w = WMO[code] || ['🌡️', 'Weather']; return code <= 1 && day === 0 ? ['🌙', code === 0 ? 'Clear night' : 'Mostly clear'] : w; };
let wxBusy = false;
function locate() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('this phone has no location service for the app'));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(e), { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 });
  });
}
async function updateLocation(manual) {
  if (wxBusy) return; wxBusy = true; render();
  try {
    const c = await locate();
    let place = '', region = '';
    try { const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${c.latitude}&longitude=${c.longitude}&localityLanguage=en`); if (r.ok) { const g = await r.json(); place = g.city || g.locality || ''; region = g.principalSubdivision || ''; } } catch (_) {}
    state.loc = { lat: Math.round(c.latitude * 100) / 100, lon: Math.round(c.longitude * 100) / 100, place, region, at: nowISO() };
    state.settings.weatherOn = true; save();
    wxBusy = false; await fetchWeather(true);
    if (manual) toast(place ? '📍 ' + place : 'Location updated');
  } catch (e) {
    wxBusy = false;
    banners.info = e && e.code === 1
      ? "Location isn't allowed for this app yet. To allow it: iPhone Settings → Privacy & Security → Location Services → Safari Websites → While Using the App. Then tap Update location."
      : "Couldn't get your location just now (" + ((e && e.message) || 'unknown error') + '). Try again outside or in a minute.';
    renderBanner(); render();
  }
}
async function fetchWeather(force) {
  if (!state.loc || wxBusy) return;
  if (!force && state.weather && Date.now() - new Date(state.weather.at) < 30 * 60e3) return;
  wxBusy = true;
  try {
    const { lat, lon } = state.loc;
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=2`, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    state.weather = { at: nowISO(), data: await r.json() }; save();
  } catch (e) { /* keep the last saved weather; the card says how old it is */ }
  finally { wxBusy = false; render(); }
}
function weatherCard() {
  if (!state.settings.weatherOn) return '';

  if (!W || !W.current) return `<div class="card"><span class="c-lab" style="--c:var(--k-posting)">Weather · ${esc(L.place || 'your location')}</span><span class="c-s">${wxBusy ? 'Loading the weather…' : "Couldn't load the weather yet."}</span><div class="wx-acts"><button class="btn small ghost" type="button" data-act="wx-refresh">Try again</button></div></div>`;
  const c = W.current, d = W.daily || {}; const [ico, txt] = wmo(c.weather_code, c.is_day);

    <div class="wx-meta">${d.temperature_2m_max ? `<span>Today ${Math.round(d.temperature_2m_max[0])}° / ${Math.round(d.temperature_2m_min[0])}°</span>` : ''}${d.precipitation_probability_max ? `<span>🌂 ${d.precipitation_probability_max[0]}% rain</span>` : ''}<span>💧 ${c.relative_humidity_2m}%</span><span>💨 ${Math.round(c.wind_speed_10m)} km/h</span></div>
    ${tm ? `<div class="wx-meta"><span>Tomorrow ${tm[0]} ${Math.round(d.temperature_2m_max[1])}° / ${Math.round(d.temperature_2m_min[1])}°${d.precipitation_probability_max ? ' · ' + d.precipitation_probability_max[1] + '% rain' : ''}</span></div>` : ''}

let otJustDone = null;
function ring(done, total, size, key) {

function hl(text, terms) {
  const t = String(text ?? '');
  if (!terms.length) return esc(t);
  const re = new RegExp('(' + terms.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
  return t.split(re).map((part, i) => i % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part)).join('');
}

  try {
