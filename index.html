<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inemuri</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inemuri">
<meta name="theme-color" content="#F6F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E2622" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap"></noscript>
<style>
/* Look carried over from EverythingEverywhere: each section wears an anaesthesia syringe-label colour.
   Today = induction yellow, Study = antiemetic salmon, To-do = local-anaesthetic grey, Academics = opioid blue,
   OT = relaxant red, Roster = vasopressor violet, Cases = anticholinergic green, NBA = benzodiazepine orange. */
:root{
  --bg:#f1f2f4;--surface:#fff;--surface-2:#e9ebee;--line:#d9dce1;--sep:rgba(17,18,20,.14);--bar:rgba(241,242,244,.88);
  --fg:#121316;--fg-2:#3b3e45;--fg-3:#676b73;--on-label:#121316;--scrim:rgba(10,12,20,.4);
  --good:#2f6b3a;--good-soft:#dcecd2;--warn:#8a6100;--warn-soft:#fdf1c7;--danger:#b3261e;
  --k-acad:#5d7a2e;--k-exam:#c0264b;--k-posting:#2c6e8f;--k-duty:#7a4f9a;--k-case:#2d6a1e;
  --f-today:#ffd400;--i-today:#7a5a00;--s-today:#fff4bf;
  --f-study:#f9a08f;--i-study:#a3341f;--s-study:#ffe6e0;
  --f-todos:#b8bcc4;--i-todos:#474c55;--s-todos:#eceef1;
  --f-calendar:#14a5e2;--i-calendar:#06628c;--s-calendar:#d8f0fb;
  --f-ot:#ff4b55;--i-ot:#b0121d;--s-ot:#ffe0e2;
  --f-roster:#a47cc4;--i-roster:#5d3a7c;--s-roster:#efe5f7;
  --f-cases:#5fbd47;--i-cases:#2d6a1e;--s-cases:#e0f3d9;
  --f-nba:#ff8a1f;--i-nba:#a54b00;--s-nba:#ffe8d2;
  --f-backup:#d9dce1;--i-backup:#3b3e45;--s-backup:#e9ebee;
  --f-reminders:#4fd1b5;--i-reminders:#0f6e5c;--s-reminders:#d5f5ec;
  --f-advances:#7dd3fc;--f-music:#b39ddb;
  --font-body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --side:0px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0e10;--surface:#18191c;--surface-2:#222428;--line:#30333a;--sep:rgba(240,242,245,.12);--bar:rgba(13,14,16,.88);
  --fg:#f1f2f4;--fg-2:#c3c6cc;--fg-3:#8f939b;--scrim:rgba(0,0,0,.55);
  --good:#8fd09a;--good-soft:#1f3523;--warn:#f0be63;--warn-soft:#3d2d10;--danger:#ff8a80;
  --k-acad:#acd06a;--k-exam:#fb7f9b;--k-posting:#74b8d8;--k-duty:#c9a8e8;--k-case:#8bd776;
  --i-today:#ffd400;--s-today:#332a00;--i-study:#ffb3a3;--s-study:#3a1d17;--i-todos:#c9ccd2;--s-todos:#26282c;
  --i-calendar:#4cc2f2;--s-calendar:#0b2a38;--i-ot:#ff6b73;--s-ot:#3a1215;--i-roster:#c9a7e6;--s-roster:#2a1e36;
  --i-cases:#8bd776;--s-cases:#182e12;--i-nba:#ffa24d;--s-nba:#382210;--i-backup:#c3c6cc;--s-backup:#222428;--f-backup:#8f939b;--i-reminders:#4fd1b5;--s-reminders:#11332c;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:16.5px/1.38 var(--font-body);-webkit-font-smoothing:antialiased;padding-left:var(--side)}
body.locked{overflow:hidden;position:fixed;left:0;right:0;width:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--fg-3)}

/* nav bar */
.navbar{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep);padding-top:env(safe-area-inset-top)}
.nb-in{height:52px;max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.nb-t{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.avbtn{justify-self:start;width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;box-shadow:0 0 0 2px var(--bg),0 0 0 4.5px var(--label)}
.nb-r{justify-self:end;display:flex;gap:4px}
.nb-l{justify-self:start;display:flex;align-items:center;gap:8px}
.cartbtn{position:relative}
.cart-n{position:absolute;top:1px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#C93A46;color:#FFFFFF!important;font-size:10.5px;font-weight:700;line-height:17px;text-align:center;font-family:var(--font-body,system-ui)!important;box-shadow:0 0 0 2px var(--bg)}
.cart-n[hidden]{display:none}
.iconbtn{width:38px;height:38px;border-radius:50%;color:var(--accent);display:grid;place-items:center}
.iconbtn:active{background:var(--surface-2)}
#banner{max-width:760px;margin:0 auto;padding:0 16px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin:10px 0 0;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.banner span{flex:1}

/* page */
.page{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:22px}
.lt-wrap{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.lt{align-self:flex-start;margin:0;background:var(--label);color:var(--on-label);font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1;letter-spacing:.01em;text-transform:uppercase;padding:7px 14px 4px;border-radius:7px}
.lt-sub{color:var(--fg-2);font-size:15px}
.sec{display:flex;flex-direction:column;gap:7px;min-width:0}
.sh{margin:0;padding:0 4px;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2);display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot{margin:0;padding:0 4px;font-size:13px;color:var(--fg-3)}

/* grouped list */
.group{background:var(--surface);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:11px 14px;width:100%;text-align:left;color:var(--fg);min-width:0}
.group>*+.row::before,.group>*+.rowwrap::before{content:"";position:absolute;top:0;right:0;left:14px;height:.5px;background:var(--sep)}
.rowwrap{position:relative;display:flex;align-items:center}
.rowwrap .row{flex:1}
button.row:active{background:var(--surface-2)}
.row.empty{color:var(--fg-3)}
.r-bar{align-self:stretch;width:4px;border-radius:2px;background:var(--c);flex:none}
.r-time{width:58px;flex:none;font-size:13px;color:var(--fg-2);font-weight:500;font-variant-numeric:tabular-nums}
.r-when{width:38px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.r-when b{font-family:var(--font-display);font-size:20px}
.r-when small{font-size:11px;color:var(--fg-3);text-transform:uppercase}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.r-t{font-size:16px;overflow-wrap:anywhere}
.r-s{font-size:13px;color:var(--fg-3);overflow-wrap:anywhere}
.r-k{flex:none;font-size:12px;font-weight:600;color:var(--c)}
.chev{width:8px;height:13px;flex:none;fill:none;stroke:var(--fg-3);stroke-width:2;stroke-linecap:round;opacity:.6}
.kv .r-l{flex:none}.kv .r-v{flex:1;text-align:right;color:var(--fg-3);overflow-wrap:anywhere}
.spec{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;text-transform:uppercase;flex:none}

/* cards */
.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;color:var(--fg);min-width:0}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.c-lab{font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--accent))}
.c-big{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1.05;text-transform:uppercase}
.c-t{font-family:var(--font-display);font-size:21px;font-weight:700}
.c-s{font-size:15px;color:var(--fg-2)}
.c-m{font-size:13px;color:var(--fg-3)}
.hero{background:var(--label);color:var(--on-label)}
.hero .c-lab,.hero .c-s,.hero .c-m{color:var(--on-label);opacity:.85}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px 12px 17px;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:inset 5px 0 0 var(--label)}
.s-l{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3)}
.s-n{font-family:var(--font-display);font-size:32px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.s-m{font-size:12px;color:var(--fg-3);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;align-self:flex-start}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.good{background:var(--good-soft);color:var(--good)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--surface);font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--surface);color:var(--danger)}
.btn.small{min-height:34px;padding:0 12px;font-size:15px;border-radius:9px}
.btn.wide{width:100%}
.btns{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:6px 8px;border-radius:7px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600;color:var(--accent)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;border-radius:999px;padding:7px 13px;background:var(--surface);color:var(--fg-2);font-size:14px;font-weight:500;white-space:nowrap}
.strip button[aria-pressed="true"]{background:var(--label);color:var(--on-label);font-weight:600}
.track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--label);border-radius:4px}
.mix-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 24px;gap:10px;align-items:center}
.mix-row .v{text-align:right;color:var(--fg-2);font-variant-numeric:tabular-nums}

/* check circles (to-do, OT, revision) */
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.check.on{background:var(--good);border-color:var(--good)}
.check.on::after{content:"";width:12px;height:7px;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:translate(0,-1px) rotate(-45deg)}
.done .r-t{text-decoration:line-through;color:var(--fg-3)}
.xbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;color:var(--fg-3);font-size:20px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cal-head h2{margin:0;font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent)}
.cal-head h2 span{color:var(--fg)}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-size:20px}
.calbox{background:var(--surface);border-radius:16px;padding:10px 8px 12px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.dw{text-align:center;font-size:11px;font-weight:600;color:var(--fg-3);padding:2px 0 6px}
.dc{padding:3px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.dc .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.dc.wk .n{color:var(--fg-3)}
.dc.today .n{color:var(--accent);font-weight:700}
.dc.sel .n{background:var(--fg);color:var(--bg);font-weight:600}
.dc.sel.today .n{background:var(--label);color:var(--on-label)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--fg-2);font-size:12px;padding:10px 8px 0;border-top:.5px solid var(--sep);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* roster */
.rlist{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dcard.past{opacity:.55}
.dcard.today{box-shadow:inset 0 0 0 2px var(--label)}
.dc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-h .dd{font-family:var(--font-display);font-weight:700;font-size:18px}
.dc-h .dd b{color:var(--accent);margin-right:4px}
.dc-h .cov{margin-left:auto;font-size:12px;color:var(--fg-3)}
.dc-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{background:var(--surface-2);border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.cell small{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell span{font-size:14px;overflow-wrap:anywhere}
.cell.mine{background:var(--label)}.cell.mine small,.cell.mine span{color:var(--on-label);font-weight:700}

/* NBA */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ngame{background:var(--surface);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nhead{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.nrow{display:flex;align-items:center;gap:8px;color:var(--fg-3);font-variant-numeric:tabular-nums;min-width:0}
.nrow.win{color:var(--fg);font-weight:700}
.nrow .tn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;overflow:hidden}
.nrow .tn em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.nrow .tn small{font-size:11px;font-weight:400;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow b{font-size:18px}.nrow:not(.win) b{font-weight:400}
.badge{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:hsl(var(--h) 55% 28%);background:hsl(var(--h) 70% 88%);border:2px solid hsl(var(--h) 55% 55%)}
.nrow.win .badge{background:hsl(var(--h) 60% 42%);color:#fff;border-color:hsl(var(--h) 60% 32%)}
@media (prefers-color-scheme:dark){.badge{color:hsl(var(--h) 80% 85%);background:hsl(var(--h) 40% 24%);border-color:hsl(var(--h) 50% 50%)}}
.st-r{width:20px;flex:none;text-align:right;color:var(--fg-3);font-size:14px;font-variant-numeric:tabular-nums}
.st-z{width:3px;align-self:stretch;border-radius:2px;background:var(--c,transparent);flex:none;margin-left:-6px}
.st-wl{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.st-p{flex:none;width:42px;text-align:right;color:var(--fg-3);font-size:14px;font-variant-numeric:tabular-nums}
.ld-v{flex:none;font-family:var(--font-display);font-size:20px;font-weight:700}

/* forms */
.field{gap:12px}
.field .f-l{flex:none;min-width:64px}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;text-align:right;height:26px;color:var(--fg-2);font-size:16px;outline:none}
.field input.left{text-align:left;color:var(--fg)}
.field select{-webkit-appearance:none;appearance:none;color:var(--accent);direction:rtl}
.tin{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--fg);outline:none}
.tin:focus{border-color:var(--accent)}
.quick{display:flex;gap:8px}
.quick .tin{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* dock */
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:25;transform:translateX(-50%);display:flex;gap:3px;padding:5px;border-radius:999px;background:var(--fg);box-shadow:0 10px 30px -8px rgba(0,0,0,.45);transition:transform .3s cubic-bezier(.2,.9,.25,1);max-width:calc(100vw - 20px)}
body.locked .dock{transform:translate(-50%,160%)}
.dock button{flex:none;height:44px;min-width:44px;padding:0 10px;border-radius:999px;color:var(--bg);opacity:.72;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.dock button span{display:none;white-space:nowrap}
.dock button[aria-current="page"]{background:var(--c);color:var(--on-label);opacity:1;padding:0 14px 0 10px}
.dock button[aria-current="page"] span{display:inline}

/* drawer */
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(310px,84vw);background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 16px) max(14px,env(safe-area-inset-left));transform:translateX(-105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility 0s linear .3s}
.drawer.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility 0s}
.prof{position:relative;overflow:hidden;background:#121316;color:#fff;border-radius:16px;padding:24px 16px 16px;display:flex;align-items:center;gap:12px;flex:none}

/* sheet, toast */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:42;max-width:680px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top) - 24px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:16px 16px 0 0;padding:6px max(16px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s linear .32s}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}

#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--bg);text-decoration:underline;padding-left:8px;font-weight:600}

.sbar{position:relative;display:flex;align-items:center}
.sbar svg{position:absolute;left:12px;width:18px;height:18px;fill:none;stroke:var(--fg-3);stroke-width:2;stroke-linecap:round;pointer-events:none}
.sbar input{width:100%;height:44px;border:0;border-radius:12px;background:var(--surface);color:var(--fg);padding:0 14px 0 38px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.sbar input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
#s-res{display:flex;flex-direction:column;gap:16px;min-height:60vh}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
/* OT table: every column kept, scrolls sideways; tick + procedure pinned left */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;background:var(--surface);border-radius:12px}
.otbl{border-collapse:separate;border-spacing:0;min-width:100%;font-size:15px}
.otbl th,.otbl td{padding:11px 12px;text-align:left;vertical-align:top;white-space:nowrap;border-bottom:.5px solid var(--sep);background:var(--surface)}
.otbl thead th{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);border-bottom:1px solid var(--line);padding-block:9px}
.otbl tbody tr:last-child>*{border-bottom:0}
.otbl .c-tick{position:sticky;left:0;z-index:2;width:50px;min-width:50px;padding:9px 6px 9px 12px}
.otbl .c-proc{position:sticky;left:50px;z-index:2;min-width:150px;max-width:190px;white-space:normal;font-weight:600;box-shadow:8px 0 8px -8px rgba(0,0,0,.35)}
.otbl .c-proc button{text-align:left;font-weight:600}
.otbl .c-wrap{white-space:normal;min-width:150px;max-width:230px}
.otbl .c-mono{font-family:var(--font-mono);font-size:13px}
.otbl tr.done>*{background:var(--good-soft)}
.otbl tr.done .c-proc button{text-decoration:line-through;color:var(--fg-3)}
.prog-row{display:flex;align-items:center;gap:16px}
.prog-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ring{position:relative;width:var(--sz);height:var(--sz);flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring:not(.smile) svg{transform:rotate(-90deg)}
.rg-tr{fill:none;stroke:var(--surface-2);stroke-width:7}
.rg-fg{fill:none;stroke:var(--label);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.25,1)}
.rg-v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:calc(var(--sz)*.3);color:var(--fg);font-variant-numeric:tabular-nums}
.rg-v small{font-size:.55em;margin-left:1px}
.sm-face{fill:var(--label)}.sm-eye{fill:var(--on-label)}.sm-mouth{fill:none;stroke:var(--on-label);stroke-width:3.6;stroke-linecap:round}
@keyframes smilepop{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:none}}
.ring.smile.anim svg{animation:smilepop .6s cubic-bezier(.2,.9,.25,1)}
.ring.late .rg-fg{stroke:var(--warn)}.ring.late .rg-tr{stroke:var(--warn-soft)}
.rg-v.stack{flex-direction:column;line-height:1}
.rg-v.stack small{font-family:var(--font-mono);font-size:calc(var(--sz)*.13);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-3);margin:2px 0 0}
.rem{display:flex;align-items:center;gap:14px;padding:12px 14px}
.rem .r-main{gap:3px}
.nudge{color:var(--warn);font-size:13.5px}
@media (prefers-reduced-motion:reduce){.rg-fg{transition:none}.ring.smile.anim svg{animation:none}}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.dc-g{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (min-width:900px){
  :root{--side:300px}
  .drawer{transform:none;visibility:visible;width:var(--side);transition:none}
  #dscrim,.dock,.avbtn{display:none}
  .page{padding-bottom:40px}
  .sheet{left:var(--side)}
  #toast{bottom:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Plum theme (Apoorva's palette) ----------
   #190019 · #2B124C · #522B5B · #854F6C · #DFB6B2 · #FBE4D8
   Section icons in the menu keep their own colours; everything else uses the palette. */
:root{
  --bg:#FBE4D8;--surface:#FFF6F1;--surface-2:#F5D9CF;--line:#E7C6BE;--sep:rgba(82,43,91,.16);--bar:rgba(251,228,216,.9);
  --fg:#190019;--fg-2:#522B5B;--fg-3:#854F6C;--scrim:rgba(25,0,25,.38);
  --accent:#522B5B;--accent-soft:#F1D0C8;--label:#2B124C;--on-label:#FBE4D8;--ring:#854F6C;--on-ring:#FBE4D8;
  --good:#3d6b45;--good-soft:#dcebd5;--warn:#9a5a12;--warn-soft:#fbe2c4;--danger:#a3243b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#190019;--surface:#2B124C;--surface-2:#3A1D5E;--line:#522B5B;--sep:rgba(223,182,178,.16);--bar:rgba(25,0,25,.9);
  --fg:#FBE4D8;--fg-2:#DFB6B2;--fg-3:#B48AA6;--scrim:rgba(0,0,0,.55);
  --accent:#DFB6B2;--accent-soft:#3D1F54;--label:#DFB6B2;--on-label:#190019;--ring:#DFB6B2;--on-ring:#190019;
  --good:#9fd8a8;--good-soft:#1f3a2a;--warn:#f0be63;--warn-soft:#3d2a10;--danger:#ff8fa3;
}}

@media (prefers-color-scheme:dark){.prof{background:#522B5B;border-color:#854F6C}}

/* ---------- Side menu: palette icons, soft fonts, glass marker on the current section ---------- */

  background:radial-gradient(120% 60% at 0% 0%,rgba(223,182,178,.55),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(133,79,108,.22),transparent 60%),var(--bg);
  --glass:rgba(255,255,255,.42);--glass-edge:rgba(255,255,255,.75);--glass-shade:rgba(82,43,91,.18);--tile:#F1D0C8;--tile-ink:#522B5B;--tile-on:#2B124C;--tile-on-ink:#FBE4D8}

  --glass:rgba(251,228,216,.10);--glass-edge:rgba(251,228,216,.28);--glass-shade:rgba(0,0,0,.45);--tile:#3D1F54;--tile-ink:#DFB6B2;--tile-on:#DFB6B2;--tile-on-ink:#190019}}

  border-color:var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 -1px 0 rgba(255,255,255,.08),0 8px 22px -12px var(--glass-shade),0 0 0 4px rgba(223,182,178,.18)!important;overflow:hidden}

/* ==========================================================================
   Capsule theme (Apoorva's tiles + palette) — overrides the plum layer above.
   Palette: #1C1E3A navy · #40263A aubergine · #6D324F wine · #B85C4A rust · #E89F6E apricot · #F7E6C4 cream
   ========================================================================== */
:root{
  --bg:#F7E6C4;--surface:#FFF6E6;--surface-2:#F0D8B4;--line:#E3C59C;--sep:rgba(64,38,58,.14);--bar:rgba(247,230,196,.9);
  --fg:#1C1E3A;--fg-2:#40263A;--fg-3:#7B5560;--scrim:rgba(28,30,58,.4);
  --accent:#6D324F;--accent-soft:#F1D3BC;--label:#40263A;--on-label:#F7E6C4;--ring:#B85C4A;--on-ring:#F7E6C4;
  --good:#3f6b45;--good-soft:#dfe9cf;--warn:#a2511f;--warn-soft:#f6d9b8;--danger:#9e2b3c;
  --t1:#E89F6E;--t1i:#1C1E3A;--t2:#B85C4A;--t2i:#F7E6C4;--t3:#6D324F;--t3i:#F7E6C4;--t4:#40263A;--t4i:#F7E6C4;--t5:#1C1E3A;--t5i:#F7E6C4;
  --tile-shadow:0 10px 18px -10px rgba(28,30,58,.55),0 2px 4px -2px rgba(28,30,58,.25);
  --tile-bevel:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.14);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1C1E3A;--surface:#26284B;--surface-2:#32345C;--line:#43456E;--sep:rgba(247,230,196,.12);--bar:rgba(28,30,58,.9);
  --fg:#F7E6C4;--fg-2:#E9C9A6;--fg-3:#B89C97;--scrim:rgba(0,0,0,.55);
  --accent:#E89F6E;--accent-soft:#3A2E48;--label:#E89F6E;--on-label:#1C1E3A;--ring:#E89F6E;--on-ring:#1C1E3A;
  --good:#a8d6a0;--good-soft:#25402e;--warn:#f0b56f;--warn-soft:#4a3020;--danger:#ff9aa8;
  --t4:#57324F;--t5:#3A3D6B;
  --tile-shadow:0 12px 20px -10px rgba(0,0,0,.75),0 2px 4px -2px rgba(0,0,0,.5);
}}
/* capsules everywhere */
.btn,.lt,.pill,.strip button,.seg,.seg button{border-radius:999px}
.btn{box-shadow:var(--tile-shadow),var(--tile-bevel)}
.btn.ghost,.btn.danger{box-shadow:0 6px 12px -8px rgba(28,30,58,.35)}

.stats .stat .s-n{color:inherit!important}

/* side menu: staggered capsule tiles */
.drawer{background:radial-gradient(120% 60% at 0% 0%,rgba(232,159,110,.35),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(109,50,79,.25),transparent 60%),var(--bg)!important}

.prof{background:linear-gradient(140deg,#1C1E3A,#40263A)!important;border:0!important;border-radius:26px;box-shadow:var(--tile-shadow),var(--tile-bevel)}
@media (prefers-color-scheme:dark){.prof{background:linear-gradient(140deg,#40263A,#6D324F)!important}}
.prof::before{background:linear-gradient(90deg,#1C1E3A,#40263A,#6D324F,#B85C4A,#E89F6E,#F7E6C4)!important}
.prof .av{background:#E89F6E!important;color:#1C1E3A!important}

  --good:#2f6b4f;--good-soft:#d8efdf;--warn:#8a5a14;--warn-soft:#f6ead2;--danger:#9b3b3b;
  --tile-shadow:0 6px 14px -10px rgba(5,31,32,.35),0 1px 2px rgba(5,31,32,.06);
  --tile-bevel:inset 0 1px 0 rgba(255,255,255,.6);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#051F20;--surface:#0B2B26;--surface-2:#163832;--line:#235347;--sep:rgba(218,241,222,.10);--bar:rgba(5,31,32,.9);
  --fg:#DAF1DE;--fg-2:#B7D6BF;--fg-3:#8EB69B;--scrim:rgba(0,0,0,.55);
  --accent:#8EB69B;--accent-soft:#163832;--label:#8EB69B;--on-label:#051F20;--ring:#8EB69B;--on-ring:#051F20;
  --good:#9fd3ae;--good-soft:#173a2c;--warn:#e8c27a;--warn-soft:#3a3018;--danger:#f0a3a3;
  --tile-shadow:0 8px 16px -10px rgba(0,0,0,.7);--tile-bevel:inset 0 1px 0 rgba(218,241,222,.06);
}}

.hello-t{margin:0;font-family:var(--font-body,Inter,system-ui);font-size:25px;font-weight:600;line-height:1.2;letter-spacing:-.01em;color:var(--fg);text-transform:none}
.hello-s{font-size:14.5px;color:var(--fg-2);font-weight:400}

/* Dark mode = the light (white-tile) look on a deep green background */
@media (prefers-color-scheme:dark){
  :root{--bg:#1B4339;--surface:#FFFFFF;--surface-2:#E3F2E6;--line:#CFE5D5;--sep:rgba(11,43,38,.10);--bar:rgba(27,67,57,.88);
    --fg:#0B2B26;--fg-2:#163832;--fg-3:#56766A;--scrim:rgba(5,31,32,.5);
    --accent:#235347;--accent-soft:#DAF1DE;--label:#163832;--on-label:#DAF1DE;--ring:#235347;--on-ring:#DAF1DE;
    --good:#2f6b4f;--good-soft:#d8efdf;--warn:#8a5a14;--warn-soft:#f6ead2;--danger:#9b3b3b;
    --tile-shadow:0 8px 18px -12px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.15);--tile-bevel:inset 0 1px 0 rgba(255,255,255,.6);color-scheme:light}
  body{background:#1B4339}
  .navbar,.navbar .nb-t,.navbar button,.navbar svg{color:#DAF1DE!important}
  .hello-d{color:#8EB69B!important}.hello-t{color:#F2F9F3!important}.hello-s{color:#C9E6D1!important}
  .lt-wrap .lt-sub,.lt-wrap .eyebrow{color:#C9E6D1!important}
  .lt{background:#DAF1DE!important;color:#0B2B26!important}
  #page>.sh,.sec>.sh,#page>.foot,.sec>.foot,.drawer .sh{color:#B7D6BF!important}
  .drawer{background:#163832!important;border-right-color:rgba(218,241,222,.12)!important}
  .hero{background:linear-gradient(135deg,#DAF1DE,#C9E6D1)!important;color:#0B2B26!important}
  .hero .c-lab,.hero .c-s,.hero .c-m{color:#235347!important}.hero .c-big{color:#0B2B26!important}
  .ditem,.ditem[data-tab]{background:var(--card-soft)!important;color:#163832!important}
  .ditem[aria-current="page"],.ditem[aria-current="page"][data-tab]{background:#DAF1DE!important;color:#0B2B26!important;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 0 0 4px rgba(142,182,155,.45)!important}
  .ditem[aria-current="page"] svg,.ditem[aria-current="page"] small{background:var(--card-soft)!important;color:#235347!important}
  .prof{background:linear-gradient(140deg,#0B2B26,#235347)!important}
  .toast{background:#0B2B26!important;color:#DAF1DE!important}
}

/* ==========================================================================
   "Sage & Oat" — friendly, clean (v4.2). Ideas: warm neutral background instead of stark white,
   soft pastel tints per kind of card, rounded friendly type, sentence case, gentle shadows.
   Fonts: Plus Jakarta Sans (headings, labels, menu) + Inter (body text).
   ========================================================================== */
:root{
  --bg:#F6F3EC;--surface:#FFFFFF;--surface-2:#F2EFE7;--line:#E7E2D7;--sep:rgba(31,42,36,.08);--bar:rgba(246,243,236,.86);
  --fg:#1F2A24;--fg-2:#4A5650;--fg-3:#8A938D;--scrim:rgba(20,26,23,.35);
  --accent:#3E7B5E;--accent-soft:#E3EFE6;--label:#3E7B5E;--on-label:#FFFFFF;--ring:#3E7B5E;--on-ring:#FFFFFF;
  --t-sage:#E3EFE6;--t-sage-i:#2F6B4F;--t-peach:#FBE9DD;--t-peach-i:#9A5A33;--t-sky:#E2EEF8;--t-sky-i:#2F5E86;
  --t-lav:#ECE7F6;--t-lav-i:#5B4A8A;--t-butter:#FBF2D4;--t-butter-i:#7A6214;--t-rose:#F8E4E6;--t-rose-i:#93404B;
  --tile-shadow:0 1px 2px rgba(31,42,36,.04),0 8px 24px -14px rgba(31,42,36,.18);--tile-bevel:none;
  --f-head:"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;--font-body:"Inter",-apple-system,system-ui,sans-serif;
  --font-display:"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#1E2622;--bar:rgba(30,38,34,.86);--scrim:rgba(0,0,0,.5);
  --tile-shadow:0 1px 2px rgba(0,0,0,.2),0 10px 26px -14px rgba(0,0,0,.6)}
  body{background:#1E2622}}
body{background:var(--bg)}
/* type */
.card,.c-s,.c-m,.r-t,.r-s,.field,.foot{font-family:var(--font-body)}
.nb-t,.hello-t,.lt,.c-big,.c-t,.s-n,.btn,.ditem,.sh,.c-lab,.prof b,.bk-info b,.read-i b,.pill,.seg button{font-family:var(--f-head)!important}
.c-lab,.sh,.s-l,.bk-part,.otbl thead th,.nhead,.cell small,.r-when small{text-transform:none!important;letter-spacing:0!important}
.c-lab{font-size:13px!important;font-weight:600!important;color:var(--fg-3)!important}
.sh{font-size:15px!important;font-weight:700!important;color:var(--fg)!important;padding:0 4px!important}
.bk-part{font-family:var(--f-head);font-size:12.5px!important;font-weight:700!important;color:var(--fg-3)!important}
.c-big{text-transform:none!important;font-size:22px!important;font-weight:700!important;letter-spacing:-.01em!important;line-height:1.2!important}
.c-t,.s-n{font-weight:700!important;letter-spacing:-.01em}
.btn{text-transform:none!important;letter-spacing:0!important;font-size:15.5px!important;font-weight:600!important;border-radius:999px!important;background:var(--accent)!important;color:#fff!important;box-shadow:none!important}
.btn.ghost{background:var(--accent-soft)!important;color:var(--accent)!important}
/* page headings: friendly, no boxed labels */
.lt{background:none!important;color:var(--fg)!important;box-shadow:none!important;padding:0!important;text-transform:none!important;font-size:27px!important;font-weight:700!important;letter-spacing:-.02em!important;line-height:1.15!important;border-radius:0!important}
.lt-sub{color:var(--fg-3)!important;font-size:14.5px!important}
.eyebrow{font-family:var(--f-head)!important;text-transform:none!important;letter-spacing:0!important;font-size:13px!important;color:var(--fg-3)!important;font-weight:600!important}
.hello-t{font-weight:700!important;font-size:27px!important;letter-spacing:-.02em!important;color:var(--fg)!important}
.hello-d{color:var(--fg-3)!important}.hello-s{color:var(--fg-2)!important}
.nb-t{color:var(--fg)!important;font-weight:700!important}
.navbar,.navbar button,.navbar svg{color:var(--fg)!important}
/* cards */
.card{background:var(--surface)!important;border:0!important;border-radius:22px!important;box-shadow:var(--tile-shadow)!important;color:var(--fg)!important}
.hero{background:var(--t-sage)!important;color:var(--fg)!important}
.hero .c-lab{color:var(--t-sage-i)!important}.hero .c-big{color:var(--fg)!important}.hero .c-s{color:var(--fg-2)!important}.hero .c-m{color:var(--t-sage-i)!important}
.readc{background:var(--t-peach)!important}.readc .c-lab,.readc .c-m{color:var(--t-peach-i)!important}
.read-i{background:var(--card-soft)!important;border-radius:16px!important}.read-i small{color:var(--t-peach-i)!important}
.card[style*="k-exam"]{background:var(--t-lav)!important}.card[style*="k-exam"] .c-lab{color:var(--t-lav-i)!important}
.wx,.card:has(.wx-acts){background:var(--t-sky)!important}.card:has(.wx-acts) .c-lab{color:var(--t-sky-i)!important}
.stats .stat,.stats .stat:nth-child(n){background:var(--surface-2)!important;border-radius:16px!important;color:var(--fg)!important}
.group{border-radius:22px!important;overflow:hidden;box-shadow:var(--tile-shadow)!important;border:0!important}
.check.on{background:var(--accent)!important;border-color:var(--accent)!important}
.track{background:var(--surface-2)!important}.fill{background:var(--accent)!important}
/* side menu */
.drawer{background:var(--bg)!important;border-right:1px solid var(--line)!important}
.drawer .sh{font-size:12.5px!important;color:var(--fg-3)!important;font-weight:600!important}
.ditem,.ditem[data-tab]{background:transparent!important;box-shadow:none!important;color:var(--fg-2)!important;text-transform:none!important;letter-spacing:0!important;font-size:15.5px!important;font-weight:500!important;border-radius:16px!important;min-height:46px!important;transform:none!important}
.ditem[aria-current="page"],.ditem[aria-current="page"][data-tab]{background:var(--surface)!important;color:var(--fg)!important;font-weight:700!important;box-shadow:var(--tile-shadow)!important}
.ditem[aria-current="page"]::after,.ditem::after{display:none!important}
.ditem svg,.ditem[data-tab] svg,.ditem[aria-current="page"] svg{width:34px!important;height:34px!important;padding:7px!important;border-radius:12px!important;background:var(--t-sage)!important;color:var(--t-sage-i)!important}
.ditem[data-tab="today"] svg{background:var(--t-butter)!important;color:var(--t-butter-i)!important}
.ditem[data-tab="reminders"] svg,.ditem[data-tab="backup"] svg{background:var(--t-rose)!important;color:var(--t-rose-i)!important}
.ditem[data-tab="study"] svg,.ditem[data-tab="todos"] svg{background:var(--t-peach)!important;color:var(--t-peach-i)!important}
.ditem[data-tab="calendar"] svg,.ditem[data-tab="advances"] svg{background:var(--t-lav)!important;color:var(--t-lav-i)!important}
.ditem[data-tab="ot"] svg,.ditem[data-tab="roster"] svg,.ditem[data-tab="cases"] svg{background:var(--t-sky)!important;color:var(--t-sky-i)!important}
.ditem small,.ditem[aria-current="page"] small{background:var(--accent-soft)!important;color:var(--accent)!important;font-weight:600!important}
.prof{background:var(--surface)!important;color:var(--fg)!important;box-shadow:var(--tile-shadow)!important;border-radius:22px!important}
.prof *{color:var(--fg-2)}.prof b{color:var(--fg)!important;font-weight:700!important}
.prof .btn,.prof .btn.ghost{background:var(--accent-soft)!important;color:var(--accent)!important}
.avbtn{background:var(--t-sage)!important;color:var(--t-sage-i)!important}
#toast,.toast{background:#1F2A24!important;color:#F6F3EC!important;border-radius:999px!important}
/* dark mode: same friendly cards on a deep warm background */
@media (prefers-color-scheme:dark){
  .nb-t,.navbar,.navbar button,.navbar svg,.hello-t,.lt{color:#F1EEE6!important}
  .hello-d,.lt-sub,.eyebrow,.drawer .sh{color:#9AA59F!important}.hello-s{color:#C9CFCB!important}
  #page>.sh,.sec>.sh{color:#F1EEE6!important}#page>.foot,.sec>.foot{color:#9AA59F!important}
  .drawer{background:#19201D!important;border-right-color:rgba(255,255,255,.06)!important}
  .ditem,.ditem[data-tab]{color:#C9CFCB!important}
  .ditem[aria-current="page"],.ditem[aria-current="page"][data-tab]{background:var(--card-soft)!important;color:#1F2A24!important}
  .prof{background:var(--card-soft)!important}
  #toast,.toast{background:#F6F3EC!important;color:#1F2A24!important}
}
.ditem,.ditem[data-tab]{border:0!important;outline:0}
.prof::before,.prof::after{display:none!important}
.navbar .avbtn,.navbar .avbtn *{color:var(--t-sage-i)!important}
/* sheets: always light card colours so text stays readable in dark mode */
.sheet,#sheet{background:var(--card-soft)!important;color:#1F2A24!important}
.sheet .bk-t,.sheet .bk-info b,.sheet h2,.sheet .row,.sheet .r-t,.sheet label,.sheet input,.sheet textarea,.sheet select{color:#1F2A24!important}
.sheet .bk-n,.sheet .bk-part,.sheet small,.sheet .foot,.sheet .bk-info span,.sheet .r-s{color:#6F7A74!important}
.sheet .bk-row.done .bk-t{color:#9AA39E!important}
.sheet .check{border-color:#C9CFC9!important;background:var(--card-soft)}
.sheet .check.on{background:#3E7B5E!important;border-color:#3E7B5E!important}
.sheet .group,.sheet .field,.sheet input,.sheet textarea,.sheet select{background:#F6F3EC!important}
.sheet .bk-list{border-top-color:#E7E2D7!important}
.sheet .ring circle:first-child{stroke:#ECE8DF}
.sheet .sheet-head{background:var(--card-soft)!important;color:#1F2A24!important;border-bottom-color:#E7E2D7!important}
.sheet .sheet-head .link{color:#3E7B5E!important}

.prof .pwx .pwx-t b,.prof .pwx .pwx-t span,.prof .pwx .pwx-t small{color:#1F2A24!important}
.prof .pwx-moon .pwx-t b,.prof .pwx-moon .pwx-t span,.prof .pwx-moon .pwx-t small,.prof .pwx-partlyn .pwx-t b,.prof .pwx-partlyn .pwx-t span,.prof .pwx-partlyn .pwx-t small{color:#F1EEE6!important}

html,body{overflow-x:hidden;max-width:100%}
body,button,input,select,textarea,td,th,.r-t,.r-s,.c-t,.c-s,.c-big,.bk-t,.read-i b,.note-row span,.note-ul li{overflow-wrap:anywhere;word-break:break-word;-webkit-hyphens:manual;hyphens:manual}
.r-main,.prog-txt,.bk-info,.pwx-t,.hello,.card,.row>span{min-width:0}
.otbl .c-proc,.otbl .c-proc button{white-space:normal!important;overflow-wrap:anywhere;word-break:break-word;max-width:44vw}
.c-mono,.mrank,.gt-v,.bk-n,.r-time{word-break:normal;overflow-wrap:normal;hyphens:none}

/* Today banner */
.tban{position:relative;margin:4px 0 2px;min-height:190px;border-radius:26px;overflow:hidden;display:flex;align-items:flex-end;box-shadow:var(--tile-shadow)}
.tban-day{background:linear-gradient(180deg,#9CC9EF,#D6EAF6 72%)}
.tban-dawn{background:linear-gradient(180deg,#5B6FA8,#E9A9A0 75%)}
.tban-dusk{background:linear-gradient(180deg,#45507F,#E7A27A 78%)}
.tban-night{background:linear-gradient(180deg,#0E1428,#2A3866 82%)}
.tban-art,.tban-pic{position:absolute;inset:0;width:100%;height:100%}
.tban-pic{object-fit:cover}
.tban::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(8,12,20,.62));pointer-events:none}
.tban-txt{position:relative;z-index:2;width:100%;padding:16px 16px 14px;display:flex;flex-direction:column;gap:3px}
.tban .hello-row{margin-bottom:2px}
.tban .hello-d,.tban .hello-s{color:rgba(255,255,255,.88)!important;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.tban .hello-t{color:#fff!important;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.tban .wxchip{background:rgba(255,255,255,.22)!important;color:#fff!important;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tban-cam{position:absolute;z-index:3;top:12px;right:12px;width:38px;height:38px;border-radius:999px;background:rgba(10,14,24,.38);display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tban-cam svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linejoin:round}
.hero-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hg{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#eee}
.hg img{width:100%;height:100%;object-fit:cover}
.hg button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:18px;line-height:1}
@media (prefers-color-scheme:dark){.tban .hello-t,.tban .hello-d,.tban .hello-s{color:#fff!important}}

/* profile card: soft wash of colour taken from your photo */
.prof.tinted{position:relative;overflow:hidden;isolation:isolate}
.prof.tinted>*{position:relative;z-index:1}
.prof.tinted>.prof-bg{position:absolute;z-index:0;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) saturate(1.5);transform:scale(1.15)}
.prof.tinted::after{content:'';position:absolute;inset:0;z-index:0;background:linear-gradient(160deg,rgba(255,255,255,.42),rgba(255,255,255,.72) 70%)}
.prof.tinted.none>.prof-bg{background:radial-gradient(circle at 20% 20%,#BFE3CB,transparent 60%),radial-gradient(circle at 85% 30%,#F8D9C4,transparent 55%),radial-gradient(circle at 60% 90%,#D9D2F2,transparent 60%),#F6F3EC;filter:none;transform:none;inset:0}
.prof.tinted .prof-top b,.prof.tinted .prof-top>div>b{font-size:22px!important;letter-spacing:-.02em;color:#14201A!important}
.prof.tinted .prof-top span{color:#2E3B34!important;font-weight:500}
.prof.tinted .av{width:64px!important;height:64px!important;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 6px 16px -6px rgba(0,0,0,.35)}
.prof.tinted .pl span,.prof.tinted .pl{color:#25322B!important}
.prof.tinted .btn.ghost{background:var(--card-soft)!important;color:#2F6B4F!important}
.prof.tinted .pwx{box-shadow:0 4px 14px -8px rgba(0,0,0,.3)}

/* readability on the tinted card */
.prof.tinted::after{background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.82) 45%,rgba(255,255,255,.93) 100%)!important}
.prof.tinted>.prof-bg{filter:blur(34px) saturate(1.25)!important;opacity:.85}
.prof.tinted .prof-top b,.prof.tinted .prof-top>div>b{color:#0E1913!important;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.prof.tinted .prof-top span{color:#1F2B24!important;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.prof.tinted .prof-l{background:var(--card-soft);border-radius:16px;padding:10px 12px;box-shadow:0 2px 10px -6px rgba(0,0,0,.25)}
.prof.tinted .pl,.prof.tinted .pl span{color:#1A2620!important;font-weight:500}
.prof.tinted .pl svg{color:#3E7B5E!important;stroke:#3E7B5E!important}
.prof.tinted .btn.ghost{background:var(--card-soft)!important;color:#2F6B4F!important;box-shadow:0 2px 10px -6px rgba(0,0,0,.25)!important}

/* profile card v3: photo colours only in a cover strip at the top; name and greeting sit on plain white below it */
.drawer .prof.tinted{background:var(--card-soft)!important;padding-top:58px!important}
.drawer .prof.tinted::after{display:none!important}
.drawer .prof.tinted>.prof-bg{inset:0 0 auto 0!important;height:84px!important;transform:none!important;filter:blur(18px) saturate(1.3)!important;opacity:1!important;background-size:cover;background-position:center;border-radius:22px 22px 0 0}
.drawer .prof.tinted>.prof-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 50%,rgba(255,255,255,.9))}
.drawer .prof.tinted.none>.prof-bg{filter:none!important}
.drawer .prof.tinted .prof-top{align-items:flex-end}
.drawer .prof.tinted .prof-top b,.drawer .prof.tinted .prof-top>div>b{color:#14201A!important;text-shadow:none!important;font-size:21px!important}
.drawer .prof.tinted .prof-top span,.drawer .prof.tinted .prof-top>div>span{color:#4A5650!important;text-shadow:none!important}
.drawer .prof.tinted .prof-l{background:#F6F3EC!important;box-shadow:none!important}

.bcats button{white-space:nowrap}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bite{display:flex!important;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:13px!important;min-height:132px}
.bite-cat{font-size:11.5px;font-weight:700;color:var(--accent)}
.bite b{font-family:var(--f-head,inherit);font-size:15px;font-weight:700;line-height:1.25}
.bite-1{font-size:12.5px;color:var(--fg-2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bite small{margin-top:auto;font-size:11px;color:var(--fg-3)}
.bite-t{margin:2px 2px 6px;font-family:var(--f-head,inherit);font-size:20px;color:#14201A}
.bite-pearl{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:#FBF2D4;color:#5C4A10}
.bite-pearl b{font-size:12px;text-transform:uppercase;letter-spacing:.05em}

/* side menu: emoji icons in soft pastel tiles, like Bite-size */
.ditem .demo{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;line-height:1;background:var(--t-sage)}
.ditem[data-tab="today"] .demo{background:var(--t-butter)}
.ditem[data-tab="reminders"] .demo,.ditem[data-tab="backup"] .demo{background:var(--t-rose)}
.ditem[data-tab="study"] .demo,.ditem[data-tab="todos"] .demo{background:var(--t-peach)}
.ditem[data-tab="calendar"] .demo,.ditem[data-tab="advances"] .demo,.ditem[data-tab="music"] .demo{background:var(--t-lav)}
.ditem[data-tab="ot"] .demo,.ditem[data-tab="roster"] .demo,.ditem[data-tab="cases"] .demo{background:var(--t-sky)}
.ditem[aria-current="page"] .demo{background:var(--card-soft);box-shadow:0 0 0 1.5px rgba(62,123,94,.35)}

/* Today banner v2: small greeting in a frosted chip, more of the picture visible */
.tban{min-height:220px;align-items:flex-end}
.tban::after{background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 65%,rgba(0,0,0,.25))!important}
.tban-top{position:absolute;z-index:3;top:12px;left:12px;right:60px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tban-date{font-size:12.5px;font-weight:600;color:#fff;padding:5px 10px;border-radius:999px;background:rgba(10,14,24,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tban .wxchip{font-size:12.5px!important;padding:5px 10px!important;max-width:none!important}
.tban-txt{width:auto!important;max-width:78%;margin:0 12px 12px;padding:9px 13px!important;border-radius:16px;background:rgba(10,14,24,.36);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);gap:1px!important}
.tban .hello-t{font-size:18px!important;line-height:1.2!important;display:flex;align-items:center;gap:6px;text-shadow:none!important;margin:0}
.tban .hello-s{font-size:12.5px!important;text-shadow:none!important}
.paw{width:17px;height:17px;flex:none;fill:#fff;opacity:.95}

/* habits */
.habc{gap:8px}
.hab-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.hab-row::-webkit-scrollbar{display:none}
.hab{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;color:var(--fg-2)}
.hab-e{width:46px;height:46px;border-radius:999px;display:grid;place-items:center;font-size:21px;background:var(--surface-2);transition:transform .15s}
.hab.on .hab-e{background:var(--accent);color:#fff;font-size:20px;font-weight:700}
.hab:active .hab-e{transform:scale(.92)}
.hab-n{font-size:11.5px;line-height:1.15;text-align:center;word-break:normal!important;overflow-wrap:normal!important;white-space:nowrap}
.hab-done{align-self:flex-start;padding:7px 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.hm-sum{display:flex;align-items:center;gap:14px;padding:4px 2px 8px;color:#1F2A24}
.hm-sum b{display:block;font-size:17px}.hm-sum span{font-size:13px;color:#6F7A74}
.hm-list{display:flex;flex-direction:column;gap:10px}
.hm-bar{display:grid;grid-template-columns:1fr auto;gap:4px 8px;font-size:14px;color:#1F2A24}.hm-bar .track{grid-column:1/-1;height:7px;border-radius:9px;background:#ECE8DF}.hm-bar .fill{height:100%;border-radius:9px;background:#3E7B5E}
.hm-grid{display:flex;flex-direction:column;gap:8px}
.hm-row{display:flex;flex-direction:column;gap:4px}.hm-n{font-size:13px;color:#4A5650}
.hm-days{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.hm-days i{aspect-ratio:1;border-radius:4px;background:#ECE8DF}.hm-days i.on{background:#3E7B5E}.hm-days i.fut{background:transparent;border:1px dashed #DDD7CC}
.hab-ed{gap:6px!important;flex-wrap:wrap}.hab-ed input{min-width:0}.hab-ed input[name^=e]{width:44px;text-align:center}.hab-ed input[type=number]{width:52px}
.hab-x{font-size:12px;color:#93404B;display:flex;align-items:center;gap:4px}

/* blocks in soft green (v5.9.2): page background unchanged; cards/tiles take a gentle sage in light mode and deep green in dark mode */
:root{--card-soft:#FBF8F1;--blk:#E3EDE1;--blk-2:#D6E4D3;--bg:#F6F3EC;--surface:#E3EDE1;--surface-2:#D6E4D3;--line:#CFDDCB;--bar:rgba(246,243,236,.86)}
body{background:var(--bg)}
.card,.gt,.ht,.stats .stat,.stats .stat:nth-child(n),.group,.bk,.bite{background:var(--blk)!important}
.hero{background:#CFE3CF!important}
.readc{background:var(--t-peach)!important}
.ditem[aria-current="page"],.ditem[aria-current="page"][data-tab]{background:var(--blk)!important}
.prof{background:var(--blk)!important}
.drawer .prof.tinted{background:var(--blk)!important}
.drawer .prof.tinted>.prof-bg::after{background:linear-gradient(180deg,rgba(227,237,225,0) 50%,rgba(227,237,225,.95))!important}

.hab-e{background:#D6E4D3}

  :root{--bg:#1E2622;--blk:#1D3D35;--blk-2:#24493F;--surface:#1D3D35;--surface-2:#24493F;--line:#2F5A4E;--bar:rgba(30,38,34,.88)}
  .navbar{background:rgba(30,38,34,.88)!important}
  .strip button,.seg button{background:#24493F!important;color:#DAF1DE!important}
  .strip button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:#8EB69B!important;color:#0B2B26!important}
  .card,.gt,.ht,.stats .stat,.stats .stat:nth-child(n),.group,.bk,.bite{background:var(--blk)!important;color:#E4EFE6!important;box-shadow:0 8px 22px -14px rgba(0,0,0,.7)!important}
  .card *:not(.pill):not(.mplay):not(svg):not(path),.gt *,.group *:not(.pill),.stats .stat *,.bite *{color:inherit}
  .card .c-lab,.card .c-m,.gt .gt-l,.group .r-s,.stats .s-l,.bite small,.card .c-s,.card small{color:#A9C8B3!important}
  .card .c-big,.card .c-t,.gt .gt-v,.group .r-t,.stats .s-n,.bite b,.card b{color:#F1F7F2!important}
  .hero{background:#24493F!important}.hero .c-lab,.hero .c-m{color:#8EB69B!important}
  .readc{background:#3A3128!important}
  .gt-i,.hab-e{background:#24493F!important;color:#E4EFE6}
  .hab.on .hab-e{background:#8EB69B!important;color:#0B2B26!important}
  .ditem[aria-current="page"],.ditem[aria-current="page"][data-tab]{background:#1D3D35!important;color:#F1F7F2!important}
  .prof,.drawer .prof.tinted{background:#1D3D35!important}
  .drawer .prof.tinted>.prof-bg::after{background:linear-gradient(180deg,rgba(29,61,53,0) 45%,rgba(29,61,53,.96))!important}
  .drawer .prof.tinted .prof-top b,.drawer .prof.tinted .prof-top>div>b{color:#F1F7F2!important}
  .drawer .prof.tinted .prof-top span,.drawer .prof.tinted .prof-top>div>span{color:#A9C8B3!important}
  .drawer .prof.tinted .prof-l{background:#24493F!important}.drawer .prof.tinted .pl,.drawer .prof.tinted .pl span{color:#E4EFE6!important}
  .drawer .prof.tinted .btn.ghost{background:#24493F!important;color:#DAF1DE!important}
  .ring circle:first-child{stroke:rgba(218,241,222,.18)}
}
.sheet,#sheet{background:var(--card-soft)!important}
.sheet .sheet-head{background:var(--card-soft)!important}
.sheet .group,.sheet .card{background:#F1EDE3!important;color:#1F2A24!important}

/* sheets stay light in dark mode: keep their text dark and bars visible (v5.9.3) */
@media (prefers-color-scheme:dark){
  #sheet .card,#sheet .group,#sheet .card *,#sheet .group *{color:#1F2A24!important}
  #sheet .card,#sheet .group{background:#F1EDE3!important;box-shadow:none!important}

}
#sheet .hm-bar .track{background:#E6E0D3!important}
.sheet{transition:transform .25s ease}

/* ===== readability layer (v5.10): one place that decides text colours, checked automatically for contrast ===== */
:root{--fg:#1C2621;--fg-2:#36433C;--fg-3:#56625B;--accent-t:#2B6448}
.link,.link.strong,a{color:var(--accent-t)}

/* ==========================================================================
   Bottom tab bar v5.11: floating pill, centre home button
   ========================================================================== */
.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:30;transform:translateX(-50%);width:min(520px,calc(100vw - 24px));display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;gap:2px;padding:6px;border-radius:999px;background:linear-gradient(180deg,#2C4A41,#1D3530);box-shadow:0 12px 30px -10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.2,.9,.25,1),opacity .2s}
body.locked .tabbar{transform:translate(-50%,170%);opacity:0}
.tb-i{height:56px;min-width:0;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#E4EFE7!important;font-family:var(--font-body,inherit);font-size:11.5px;font-weight:600;letter-spacing:.01em;-webkit-tap-highlight-color:transparent}

.tb-i svg,.tb-home svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb-i[aria-current="page"]{background:#12241F;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.tb-i[aria-current="page"],.tb-i[aria-current="page"] span{color:#FFFFFF!important}
.tb-i:active{transform:scale(.95)}
.tb-home{justify-self:center;width:58px;height:58px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;background:#F3EEE4;color:#1D3530!important;box-shadow:0 8px 18px -6px rgba(0,0,0,.5),0 0 0 4px #1D3530;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.tb-home svg{width:27px;height:27px;stroke-width:2.1}
.tb-home[aria-current="page"]{background:#CFE3CF;color:#12241F!important}
.tb-home:active{transform:scale(.93)}
.page,#page{padding-bottom:calc(120px + env(safe-area-inset-bottom))!important}
#toast{bottom:calc(96px + env(safe-area-inset-bottom))!important}

/* ==========================================================================
   Smoothness v5.12: lighter repaints, instant taps
   ========================================================================== */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,label,select,summary,[data-act]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* the frosted top bar re-blurred the page on every scroll frame; a solid bar looks the same and costs nothing */
.navbar{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--bg)!important}
.ditem[aria-current="page"]{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
/* long words still wrap, but without forcing the whole page to be measured letter by letter */
body,button,input,select,textarea,.c-t,.c-s,.c-big,.bk-t,.read-i b,.note-row span,.note-ul li{overflow-wrap:break-word!important}
.otbl td,.otbl th,.r-t,.r-s,.s-m,.cell span,.pl span,.kv .r-v{overflow-wrap:anywhere!important}
.card,.row,.sec>*{min-width:0}
/* sliding pieces get their own layer so they glide instead of repainting */
.sheet,.drawer,.tabbar{will-change:transform;backface-visibility:hidden}
.scrim{will-change:opacity}
.sheet{contain:layout paint}
.tb-i,.tb-home,.btn,.card[data-act],.ditem{transition:transform .12s ease,background-color .15s ease}
.tb-i:active,.btn:active,.card[data-act]:active{transform:scale(.97)}
body::before{will-change:transform;transform:translateZ(0)}

.dump-i{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.dump-i:last-child{border-bottom:0}
.dump-dot{flex:none;width:8px;height:8px;border-radius:50%;background:#B5782A}
.dump-tag{flex:none;font-size:15px}
.dump-t{flex:1;min-width:0;font-size:15px;line-height:1.35;color:var(--fg)!important;overflow-wrap:break-word}
.dump-i .dump-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dump-ago{flex:none;font-size:12px;color:var(--fg-2)!important}
.dump-fcs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dump-fc,.dump-cat{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.6);color:#1C2621!important;border:1px solid rgba(28,38,33,.18)}
.dump-fc b{font-weight:700;margin-left:2px;color:#36433C!important}
.dump-fc.on,.dump-cat.on{background:#2B6448;color:#FFFFFF!important;border-color:#2B6448}
.dump-fc.on b{color:#FFFFFF!important}
.dump-card{display:flex;flex-direction:column;gap:8px;padding:12px 14px!important;margin-bottom:8px}
.dump-top{display:flex;gap:10px;align-items:flex-start}
#sheet .dump-t{color:#1C2621!important}#sheet .dump-ago{color:#36433C!important}
.dump-x{flex:none;width:28px;height:28px;border-radius:50%;color:#5A3A2A!important;background:rgba(255,255,255,.5)}
.dump-cats{display:flex;flex-wrap:wrap;gap:6px}
#sheet .dump-cat.on,#sheet .dump-fc.on,#sheet button.dump-cat.on{background:#2B6448!important;color:#FFFFFF!important;border-color:#2B6448!important}
#sheet .dump-cat:not(.on),#sheet .dump-fc:not(.on){background:rgba(255,255,255,.6)!important;color:#1C2621!important}
#sheet .dump-f input{background:#FFFFFF;color:#1C2621!important;border-color:rgba(28,38,33,.25)}

/* festive look v5.28: subtle, behind the content, nothing on the banner */
#nb-title:has(.nbt-b){display:inline-grid;justify-items:center;align-items:center}
#nb-title .nbt-a,#nb-title .nbt-b{grid-area:1/1;transition:opacity .6s ease,transform .6s ease;white-space:nowrap}
#nb-title .nbt-b{opacity:0;transform:translateY(5px)}
#nb-title.alt .nbt-a{opacity:0;transform:translateY(-5px)}
#nb-title.alt .nbt-b{opacity:1;transform:none}
.fest-line{margin:8px 4px 2px;font-size:13px;font-weight:600;color:var(--fg-2)!important;text-align:center;letter-spacing:.01em}
#fest-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fest-fx i{position:absolute;left:0;right:0;top:-100%;height:200%;background-repeat:repeat;will-change:transform}
#fest-fx .fx1{background-size:220px 260px;animation:festfall 38s linear infinite}
#fest-fx .fx2{background-size:330px 300px;animation:festfall 60s linear infinite;opacity:.7}
@keyframes festfall{from{transform:translate3d(0,0,0)}to{transform:translate3d(-20px,50%,0)}}
@media (prefers-reduced-motion:reduce){#fest-fx i{animation:none}}
/* Christmas / New Year: soft snow (pale grey-blue in light mode, white in dark) */
body[data-fest="christmas"] #fest-fx .fx1,body[data-fest="newyear"] #fest-fx .fx1,body[data-fest="christmas"] #fest-fx .fx2,body[data-fest="newyear"] #fest-fx .fx2{background-color:var(--snow);-webkit-mask-repeat:repeat;mask-repeat:repeat}

/* skip drawing off-screen advance cards until you scroll to them v5.29 */
.card.adv{content-visibility:auto;contain-intrinsic-size:auto 260px}

/* Off Instagram: quiet pill on Today + badge sheet */
.igp-w{display:flex;justify-content:center;margin:8px 0 0}
.igp{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 12px;border-radius:999px;border:0;font:inherit;font-size:12.5px;font-weight:500;letter-spacing:.01em;background:#E3EFE6!important;color:#2F6B4F!important}
.igp b{font-weight:700;color:inherit!important}
.tsiren{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 12px;border-radius:999px;border:0;font:inherit;font-size:12.5px;font-weight:500;letter-spacing:.01em;background:#FBE6E6!important;color:#9B2C2C!important;max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsiren b{font-weight:700;color:inherit!important}

@media (prefers-reduced-motion:reduce){.ts-dot{animation:none}}
.ts-old{color:#B03030!important}
@media (prefers-color-scheme:dark){.tsiren{background:#4A1E1E!important;color:#FBE3E3!important}.ts-dot{background:#FF7A7A}.ts-old{color:#FF9C9C!important}}
.art-c{gap:6px}.art-c .art-q{font-size:12.5px;color:var(--fg-3)}.art-c b{font-size:15.5px;line-height:1.3}
.art-c .art-m{font-size:12.5px;color:var(--fg-2)}
.pc-bday .pc-when{font-weight:600}

@media (prefers-color-scheme:dark){.igp{background:#24493F!important;color:#E4EFE6!important}.igp.hit{background:#5A4A12!important;color:#FBF2D4!important}}
#sheet .ig-top{display:flex;flex-direction:row;align-items:center;gap:14px}

#sheet .ig-nx{margin:0;padding:0 4px;font-size:14px;color:#36433C!important}
.ig-shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#sheet .ig-b{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-height:104px;padding:12px 6px;border-radius:18px;border:0;font:inherit;text-align:center;background:var(--sh-blk)!important}
#sheet .ig-b.on{background:#FBF2D4!important}
.ig-e{font-size:28px;line-height:1.15}

#sheet .ig-b small{font-size:11.5px;color:#45514A!important}

#sheet .ig-party{position:relative;overflow:hidden;align-items:center;text-align:center;gap:4px;padding:22px 16px;background:#FBF2D4!important}
.ig-big{font-size:64px;line-height:1.1;animation:igpop .7s cubic-bezier(.2,.9,.25,1) both}

#sheet .ig-name{font-family:var(--f-head,inherit);font-size:22px;line-height:1.2;color:#1C2621!important}
#sheet .ig-line{margin:2px 0 0;font-size:15px;line-height:1.5;color:#36433C!important}
.ig-conf{position:absolute;inset:0;pointer-events:none}
.ig-conf i{position:absolute;top:-14px;width:7px;height:12px;border-radius:2px;opacity:0;animation:igfall 1.8s ease-in 2 both}
@keyframes igfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(260px) rotate(540deg);opacity:0}}
@keyframes igpop{0%{transform:scale(.3) rotate(-20deg);opacity:0}70%{transform:scale(1.15) rotate(5deg);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.ig-conf{display:none}.ig-big{animation:none}}

/* Dota 2 */
.dota-g{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

.bk-btns{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}.bk-btns .link{font-size:13px;color:var(--fg-2);background:none;border:0;padding:2px}

/* v5.65: Now home, swipe, freshness, settings search, Off duty tabs */
.home-more{margin-top:2px}
.home-rest{display:flex;flex-direction:column;gap:inherit}
.home-rest>*{margin-top:12px}
.rowwrap[data-swipe]>*{transform:translateX(var(--sx,0px));transition:transform .22s ease}
.rowwrap.swiping>*{transition:none}
.rowwrap[data-swipe]::after{content:"✓ " attr(data-swipe);position:absolute;left:0;top:0;bottom:0;width:var(--sx,0px);display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--good) 20%,var(--surface));color:var(--good);transition:width .22s ease,background .15s;pointer-events:none}
.rowwrap.swiping::after{transition:none}
.rowwrap.swipe-go::after{background:var(--good);color:var(--surface)}
.fresh{font-size:12.5px;color:var(--fg-3)}
.fresh.off{color:var(--fg-2)}
.fresh.off::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#d08a2e;margin-right:6px;vertical-align:1px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);vertical-align:2px;margin-left:2px}
.offseg{margin-top:12px}
.set-qw{margin-top:12px}
.set-qw input{width:100%}
.sq-hide{display:none!important}
.ditem[data-tab="others"] svg,.ditem[data-tab="others"] .demo{background:var(--t-lav)!important;color:var(--t-lav-i)!important}
/* v5.67: case prep, viva, exam map, quiet morning, calculators */
.calc-link{display:flex!important;flex-direction:row!important;align-items:center;gap:12px;width:100%;padding:12px 14px!important;margin-bottom:10px;text-align:left}
.calc-link .chev{flex:none}
.emap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.emap-t{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:16px;background:var(--surface);text-align:center;min-width:0}
.emap-t b{font-size:13px;line-height:1.2;color:var(--fg)}
.emap-t span{font-size:12px;color:var(--fg-2)}
.emap-t.thin{background:transparent;border:1.5px dashed var(--sep)}
.emap-0{width:46px;height:46px;display:grid;place-items:center;font-size:22px;opacity:.7}
.viva-card{display:flex!important;flex-direction:column;gap:10px;padding:18px!important;min-height:220px;text-align:left;width:100%}
.viva-q{font-size:20px;line-height:1.25;color:var(--fg)}
.viva-a{margin:0}
.viva-end{display:flex!important;flex-direction:column;align-items:center;gap:6px;padding:22px!important;text-align:center}
.viva-big{font-size:40px}
.quiet-p{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--fg-2);padding:6px 12px;border-radius:999px;background:var(--surface)}
.quiet-p .link{font-size:13px}
.calc-f{gap:8px}
.calc-f input,.calc-f select{flex:1;min-width:0;text-align:right}
.calc-u{flex:none;font-size:13px;color:var(--fg-2);min-width:44px}
.calc-o .r-l{display:flex;flex-direction:column}
.calc-o small{font-size:12px;color:var(--fg-2)}
.calc-o .r-v{color:var(--fg);font-size:16px}
.ditem[data-tab="calc"] svg,.ditem[data-tab="calc"] .demo{background:var(--t-sky)!important;color:var(--t-sky-i)!important}
.calc-src .note-refs{color:var(--fg)}
.calc-src .note-refs a{color:var(--fg);text-decoration:underline}
/* ===== v5.68 appearance (Apoorva, 22 Nov 2026) ===== */
/* 2: each section carries its colour from the side menu */
body{--sec:var(--t-sage);--sec-i:var(--t-sage-i)}
body[data-sec="today"]{--sec:var(--t-butter);--sec-i:var(--t-butter-i)}
body[data-sec="study"],body[data-sec="todos"]{--sec:var(--t-peach);--sec-i:var(--t-peach-i)}
body[data-sec="calendar"],body[data-sec="advances"],body[data-sec="others"],body[data-sec="music"],body[data-sec="nba"],body[data-sec="dota"]{--sec:var(--t-lav);--sec-i:var(--t-lav-i)}
body[data-sec="ot"],body[data-sec="roster"],body[data-sec="cases"],body[data-sec="calc"]{--sec:var(--t-sky);--sec-i:var(--t-sky-i)}
body[data-sec="reminders"],body[data-sec="backup"],body[data-sec="orders"]{--sec:var(--t-rose);--sec-i:var(--t-rose-i)}
.lt-wrap{position:relative;isolation:isolate}
.lt-wrap::before{content:"";position:absolute;z-index:-1;left:calc(50% - 50vw);width:100vw;top:-80px;bottom:-26px;background:linear-gradient(180deg,color-mix(in srgb,var(--sec) 90%,transparent) 0%,color-mix(in srgb,var(--sec) 55%,transparent) 55%,transparent 100%);pointer-events:none}
@media (prefers-color-scheme:dark){.lt-wrap::before{background:linear-gradient(180deg,color-mix(in srgb,var(--sec) 16%,transparent) 0%,color-mix(in srgb,var(--sec) 7%,transparent) 55%,transparent 100%)}}
/* 1: one strong card at a time; the rest stay quiet */
#page .card:not(.hero):not(.cat-due):not(.calc-link):not(.art-hero):not(.lv-hero):not(.viva-card):not(.ig-party){background:color-mix(in srgb,var(--surface) 35%,var(--bg))!important;box-shadow:none!important;border:1px solid var(--sep)!important}
#page .card.hero,#page .card.cat-due{background:color-mix(in srgb,var(--accent) 16%,var(--surface))!important;border:0!important;box-shadow:0 12px 28px -16px color-mix(in srgb,var(--accent) 70%,transparent)!important}
#page .group{box-shadow:none!important;border:1px solid var(--sep)}
/* 3: tab bar left as it is: it carries the season/festival colours (Apoorva, 22 Nov 2026) */
/* 4: one title: the top-bar title fades in only after the big heading scrolls away (Today keeps its title) */
#nb-title{transition:opacity .2s ease}
body:not([data-sec="today"]):not(.nbt-show) #nb-title{opacity:0}
.lt-wrap .eyebrow{display:none}
/* 6: Dota cards use the same type as everything else */
.nhead{font-family:var(--font-body,inherit)!important;letter-spacing:.02em!important;text-transform:none!important;font-size:12px!important}
/* 8: glance tiles become one row of chips */
.gtiles{display:flex!important;flex-wrap:wrap;gap:8px!important}
.gt{flex-direction:row!important;align-items:center!important;gap:8px!important;min-height:0!important;padding:6px 12px 6px 6px!important;border-radius:999px!important;width:auto!important;box-shadow:none!important;border:1px solid var(--sep)!important;background:color-mix(in srgb,var(--surface) 35%,var(--bg))!important}
.gt .ring{--sz:28px!important}.gt .ring .rg-v{display:none}
.gt-i{width:28px!important;height:28px!important;border-radius:50%!important;font-size:14px!important}
.gt-v{font-size:15px!important;margin:0!important}
.gt-l{font-size:12.5px!important;color:var(--fg-2)!important}
/* 9: background doodles only on Today and Off duty */
body:not([data-sec="today"]):not([data-sec="others"]):not([data-sec="music"]):not([data-sec="nba"]):not([data-sec="dota"])::before{background-image:none!important}
/* 10: the sleepy cat */
.nap{display:flex;align-items:center;gap:12px}
.nap-cat{flex:none;width:64px;height:40px;color:var(--fg)}
.nap-cat .z{fill:var(--fg-3);font:700 9px var(--font-body,system-ui)}
.nap-cat .z{animation:zz 3.2s ease-in-out infinite}
.nap-cat .z2{animation-delay:1.1s}
@keyframes zz{0%,100%{opacity:0;transform:translate(0,2px)}40%,60%{opacity:1;transform:translate(2px,-3px)}}
.quiet-p .nap-cat{width:34px;height:21px}
.prog-cat{width:46px;height:29px;margin-left:auto;align-self:center}
/* 11: line icons in section headings instead of emoji */
.sh-i{width:18px;height:18px;flex:none;fill:none;stroke:var(--sec-i,currentColor);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px}
@media (prefers-color-scheme:dark){.sh-i{stroke:var(--sec-i,currentColor)}}
.c-lab .sh-i{width:15px;height:15px;margin-right:4px}
/* 12: soft motion */
@keyframes pgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#page.pg-in{animation:pgIn .24s ease-out}
@keyframes ringIn{from{stroke-dashoffset:188.5}}
#page.pg-in .rg-fg{animation:ringIn .9s cubic-bezier(.2,.9,.25,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop .check,.check.pop,.pop.check{animation:pop .28s ease-out}
.rowwrap.pop,.row.pop,tr.pop{animation:pgIn .25s ease-out}
@media (prefers-reduced-motion:reduce){#page.pg-in,#page.pg-in .rg-fg,.pop,.pop .check,.nap-cat .z{animation:none!important}}
/* ===== v5.69 colour (Apoorva, 22 Nov 2026) ===== */
/* 1: one meaning per colour: sage = done, amber = due soon, soft red = overdue, sky = information */
:root{--st-done:#2F6B4F;--st-soon:#C08A2E;--st-soon-bg:#FBEFD9;--st-soon-fg:#7E5410;--st-over-bg:#FBE6E6;--st-over-fg:#9B2C2C;--st-info-bg:#E2EEF8;--st-info-fg:#2F5E86;--amber:#E0A526}
@media (prefers-color-scheme:dark){:root{--st-done:#9FD0B2;--st-soon:#D9A445;--st-soon-bg:#3B2E14;--st-soon-fg:#F2CF85;--st-over-bg:#3E2222;--st-over-fg:#F4AFAF;--st-info-bg:#22303C;--st-info-fg:#A9CBEA;--amber:#E8B23A}}
.cat-due{border-color:var(--st-soon)!important}
.pill.tosync{background:var(--st-soon-bg)!important;color:var(--st-soon-fg)!important}
.gt:has(.gt-l.tosync),.stats .stat:has(.pill.tosync){background:var(--st-soon-bg)!important}
.gt-l.tosync,.stats .stat:has(.pill.tosync) .s-n{color:var(--st-soon-fg)!important}
.tsiren{background:var(--st-over-bg)!important;color:var(--st-over-fg)!important}
.ring.late .rg-fg{stroke:var(--st-over-fg)!important}
.pill.good{color:var(--st-done)!important}
/* 2: rings take the colour of their section (the 100% smiley stays) */
#page .rg-fg{stroke:var(--sec-i)}
#page .gt .rg-fg{stroke:var(--ti)}
@media (prefers-color-scheme:dark){#page .rg-tr{stroke:color-mix(in srgb,var(--sec-i) 18%,transparent)}}
/* 3: real night versions of the section colours (light pastels look grey on dark) */
@media (prefers-color-scheme:dark){:root{

  return t.split(re).map((part, i) => i % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part)).join('');
}

function rdClose() { if (rd) { rd.m.page = rd.cur; pdfSaveMeta(rd.m); if (rd.obs) rd.obs.disconnect(); if (rd.doc) rd.doc.destroy(); } rd = null; const R = $('reader'); R.hidden = true; R.innerHTML = ''; if (!$('sheet').classList.contains('open')) unlockBody(); pdfLoad(); }

  try {
