<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Desk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Desk">
<meta name="theme-color" content="#f1f2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Look carried over from EverythingEverywhere: each section wears an anaesthesia syringe-label colour.
   Today = induction yellow, Study = antiemetic salmon, To-do = local-anaesthetic grey, Academics = opioid blue,
   OT = relaxant red, Roster = vasopressor violet, Cases = anticholinergic green, NBA = benzodiazepine orange. */
:root{
  --bg:#f1f2f4;--surface:#fff;--surface-2:#e9ebee;--line:#d9dce1;--sep:rgba(17,18,20,.14);--bar:rgba(241,242,244,.88);
  --fg:#121316;--fg-2:#3b3e45;--fg-3:#676b73;--on-label:#121316;--scrim:rgba(10,12,20,.4);
  --good:#2f6b3a;--good-soft:#dcecd2;--warn:#8a6100;--warn-soft:#fdf1c7;--danger:#b3261e;
  --k-acad:#5d7a2e;--k-exam:#c0264b;--k-posting:#2c6e8f;--k-duty:#7a4f9a;--k-case:#2d6a1e;
  --f-today:#ffd400;--i-today:#7a5a00;--s-today:#fff4bf;
  --f-study:#f9a08f;--i-study:#a3341f;--s-study:#ffe6e0;
  --f-todos:#b8bcc4;--i-todos:#474c55;--s-todos:#eceef1;
  --f-calendar:#14a5e2;--i-calendar:#06628c;--s-calendar:#d8f0fb;
  --f-ot:#ff4b55;--i-ot:#b0121d;--s-ot:#ffe0e2;
  --f-roster:#a47cc4;--i-roster:#5d3a7c;--s-roster:#efe5f7;
  --f-cases:#5fbd47;--i-cases:#2d6a1e;--s-cases:#e0f3d9;
  --f-nba:#ff8a1f;--i-nba:#a54b00;--s-nba:#ffe8d2;
  --f-backup:#d9dce1;--i-backup:#3b3e45;--s-backup:#e9ebee;
  --accent:var(--i-today);--accent-soft:var(--s-today);--label:var(--f-today);
  --font-body:"Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --font-display:"Barlow Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --side:0px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0e10;--surface:#18191c;--surface-2:#222428;--line:#30333a;--sep:rgba(240,242,245,.12);--bar:rgba(13,14,16,.88);
  --fg:#f1f2f4;--fg-2:#c3c6cc;--fg-3:#8f939b;--scrim:rgba(0,0,0,.55);
  --good:#8fd09a;--good-soft:#1f3523;--warn:#f0be63;--warn-soft:#3d2d10;--danger:#ff8a80;
  --k-acad:#acd06a;--k-exam:#fb7f9b;--k-posting:#74b8d8;--k-duty:#c9a8e8;--k-case:#8bd776;
  --i-today:#ffd400;--s-today:#332a00;--i-study:#ffb3a3;--s-study:#3a1d17;--i-todos:#c9ccd2;--s-todos:#26282c;
  --i-calendar:#4cc2f2;--s-calendar:#0b2a38;--i-ot:#ff6b73;--s-ot:#3a1215;--i-roster:#c9a7e6;--s-roster:#2a1e36;
  --i-cases:#8bd776;--s-cases:#182e12;--i-nba:#ffa24d;--s-nba:#382210;--i-backup:#c3c6cc;--s-backup:#222428;--f-backup:#8f939b;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:16.5px/1.38 var(--font-body);-webkit-font-smoothing:antialiased;padding-left:var(--side)}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--fg-3)}

/* nav bar */
.navbar{position:sticky;top:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep);padding-top:env(safe-area-inset-top)}
.nb-in{height:52px;max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.nb-t{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.avbtn{justify-self:start;width:36px;height:36px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;box-shadow:0 0 0 2px var(--bg),0 0 0 4.5px var(--label)}
.nb-r{justify-self:end;display:flex;gap:4px}
.iconbtn{width:38px;height:38px;border-radius:50%;color:var(--accent);display:grid;place-items:center}
.iconbtn:active{background:var(--surface-2)}
#banner{max-width:760px;margin:0 auto;padding:0 16px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;margin:10px 0 0;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.banner span{flex:1}

/* page */
.page{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:22px}
.lt-wrap{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.lt{align-self:flex-start;margin:0;background:var(--label);color:var(--on-label);font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1;letter-spacing:.01em;text-transform:uppercase;padding:7px 14px 4px;border-radius:7px}
.lt-sub{color:var(--fg-2);font-size:15px}
.sec{display:flex;flex-direction:column;gap:7px;min-width:0}
.sh{margin:0;padding:0 4px;font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2);display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot{margin:0;padding:0 4px;font-size:13px;color:var(--fg-3)}

/* grouped list */
.group{background:var(--surface);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:11px 14px;width:100%;text-align:left;color:var(--fg);min-width:0}
.group>*+.row::before,.group>*+.rowwrap::before{content:"";position:absolute;top:0;right:0;left:14px;height:.5px;background:var(--sep)}
.rowwrap{position:relative;display:flex;align-items:center}
.rowwrap .row{flex:1}
button.row:active{background:var(--surface-2)}
.row.empty{color:var(--fg-3)}
.r-bar{align-self:stretch;width:4px;border-radius:2px;background:var(--c);flex:none}
.r-time{width:58px;flex:none;font-size:13px;color:var(--fg-2);font-weight:500;font-variant-numeric:tabular-nums}
.r-when{width:38px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.r-when b{font-family:var(--font-display);font-size:20px}
.r-when small{font-size:11px;color:var(--fg-3);text-transform:uppercase}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.r-t{font-size:16px;overflow-wrap:anywhere}
.r-s{font-size:13px;color:var(--fg-3);overflow-wrap:anywhere}
.r-k{flex:none;font-size:12px;font-weight:600;color:var(--c)}
.chev{width:8px;height:13px;flex:none;fill:none;stroke:var(--fg-3);stroke-width:2;stroke-linecap:round;opacity:.6}
.kv .r-l{flex:none}.kv .r-v{flex:1;text-align:right;color:var(--fg-3);overflow-wrap:anywhere}
.spec{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;text-transform:uppercase;flex:none}

/* cards */
.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;color:var(--fg);min-width:0}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.c-lab{font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--accent))}
.c-big{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1.05;text-transform:uppercase}
.c-t{font-family:var(--font-display);font-size:21px;font-weight:700}
.c-s{font-size:15px;color:var(--fg-2)}
.c-m{font-size:13px;color:var(--fg-3)}
.hero{background:var(--label);color:var(--on-label)}
.hero .c-lab,.hero .c-s,.hero .c-m{color:var(--on-label);opacity:.85}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px 12px 17px;display:flex;flex-direction:column;gap:3px;min-width:0;box-shadow:inset 5px 0 0 var(--label)}
.s-l{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3)}
.s-n{font-family:var(--font-display);font-size:32px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.s-m{font-size:12px;color:var(--fg-3);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;align-self:flex-start}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.good{background:var(--good-soft);color:var(--good)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--surface);font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--surface);color:var(--danger)}
.btn.small{min-height:34px;padding:0 12px;font-size:15px;border-radius:9px}
.btn.wide{width:100%}
.btns{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:6px 8px;border-radius:7px;font-size:14px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600;color:var(--accent)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;border-radius:999px;padding:7px 13px;background:var(--surface);color:var(--fg-2);font-size:14px;font-weight:500;white-space:nowrap}
.strip button[aria-pressed="true"]{background:var(--label);color:var(--on-label);font-weight:600}
.track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--label);border-radius:4px}
.mix-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 24px;gap:10px;align-items:center}
.mix-row .v{text-align:right;color:var(--fg-2);font-variant-numeric:tabular-nums}

/* check circles (to-do, OT, revision) */
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.check.on{background:var(--good);border-color:var(--good)}
.check.on::after{content:"";width:12px;height:7px;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:translate(0,-1px) rotate(-45deg)}
.done .r-t{text-decoration:line-through;color:var(--fg-3)}
.xbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;color:var(--fg-3);font-size:20px}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cal-head h2{margin:0;font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent)}
.cal-head h2 span{color:var(--fg)}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-size:20px}
.calbox{background:var(--surface);border-radius:16px;padding:10px 8px 12px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.dw{text-align:center;font-size:11px;font-weight:600;color:var(--fg-3);padding:2px 0 6px}
.dc{padding:3px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.dc .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.dc.wk .n{color:var(--fg-3)}
.dc.today .n{color:var(--accent);font-weight:700}
.dc.sel .n{background:var(--fg);color:var(--bg);font-weight:600}
.dc.sel.today .n{background:var(--label);color:var(--on-label)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--fg-2);font-size:12px;padding:10px 8px 0;border-top:.5px solid var(--sep);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* roster */
.rlist{display:flex;flex-direction:column;gap:10px}
.dcard{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.dcard.past{opacity:.55}
.dcard.today{box-shadow:inset 0 0 0 2px var(--label)}
.dc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-h .dd{font-family:var(--font-display);font-weight:700;font-size:18px}
.dc-h .dd b{color:var(--accent);margin-right:4px}
.dc-h .cov{margin-left:auto;font-size:12px;color:var(--fg-3)}
.dc-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cell{background:var(--surface-2);border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.cell small{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell span{font-size:14px;overflow-wrap:anywhere}
.cell.mine{background:var(--label)}.cell.mine small,.cell.mine span{color:var(--on-label);font-weight:700}

/* NBA */
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ngame{background:var(--surface);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.nhead{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.nrow{display:flex;align-items:center;gap:8px;color:var(--fg-3);font-variant-numeric:tabular-nums;min-width:0}
.nrow.win{color:var(--fg);font-weight:700}
.nrow .tn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;overflow:hidden}
.nrow .tn em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.nrow .tn small{font-size:11px;font-weight:400;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow b{font-size:18px}.nrow:not(.win) b{font-weight:400}
.badge{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:hsl(var(--h) 55% 28%);background:hsl(var(--h) 70% 88%);border:2px solid hsl(var(--h) 55% 55%)}
.nrow.win .badge{background:hsl(var(--h) 60% 42%);color:#fff;border-color:hsl(var(--h) 60% 32%)}
@media (prefers-color-scheme:dark){.badge{color:hsl(var(--h) 80% 85%);background:hsl(var(--h) 40% 24%);border-color:hsl(var(--h) 50% 50%)}}
.st-r{width:20px;flex:none;text-align:right;color:var(--fg-3);font-size:14px;font-variant-numeric:tabular-nums}
.st-z{width:3px;align-self:stretch;border-radius:2px;background:var(--c,transparent);flex:none;margin-left:-6px}
.st-wl{flex:none;font-weight:600;font-variant-numeric:tabular-nums}
.st-p{flex:none;width:42px;text-align:right;color:var(--fg-3);font-size:14px;font-variant-numeric:tabular-nums}
.ld-v{flex:none;font-family:var(--font-display);font-size:20px;font-weight:700}

/* forms */
.field{gap:12px}
.field .f-l{flex:none;min-width:64px}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;text-align:right;height:26px;color:var(--fg-2);font-size:16px;outline:none}
.field input.left{text-align:left;color:var(--fg)}
.field select{-webkit-appearance:none;appearance:none;color:var(--accent);direction:rtl}
.tin{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--fg);outline:none}
.tin:focus{border-color:var(--accent)}
.quick{display:flex;gap:8px}
.quick .tin{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* dock */
.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:25;transform:translateX(-50%);display:flex;gap:3px;padding:5px;border-radius:999px;background:var(--fg);box-shadow:0 10px 30px -8px rgba(0,0,0,.45);transition:transform .3s cubic-bezier(.2,.9,.25,1);max-width:calc(100vw - 20px)}
body.locked .dock{transform:translate(-50%,160%)}
.dock button{flex:none;height:44px;min-width:44px;padding:0 10px;border-radius:999px;color:var(--bg);opacity:.72;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.dock button span{display:none;white-space:nowrap}
.dock button[aria-current="page"]{background:var(--c);color:var(--on-label);opacity:1;padding:0 14px 0 10px}
.dock button[aria-current="page"] span{display:inline}

/* drawer */
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:41;width:min(310px,84vw);background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 16px) max(14px,env(safe-area-inset-left));transform:translateX(-105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility 0s linear .3s}
.drawer.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.25,1),visibility 0s}
.prof{position:relative;overflow:hidden;background:#121316;color:#fff;border-radius:16px;padding:24px 16px 16px;display:flex;align-items:center;gap:12px;flex:none}
.prof::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,var(--f-today) 0 12.5%,var(--f-study) 0 25%,var(--f-todos) 0 37.5%,var(--f-calendar) 0 50%,var(--f-ot) 0 62.5%,var(--f-roster) 0 75%,var(--f-cases) 0 87.5%,var(--f-nba) 0)}
.prof .av{width:52px;height:52px;border-radius:50%;background:var(--f-today);color:#121316;display:grid;place-items:center;font-family:var(--font-display);font-size:24px;font-weight:800;flex:none}
.prof b{display:block;font-family:var(--font-display);font-size:22px}
.prof span{font-size:13px;opacity:.85}
.dnav{display:flex;flex-direction:column;gap:4px}
.dnav .sh{margin-top:8px}
.ditem{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:7px 10px;border-radius:12px;font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;text-align:left}
.ditem svg{width:34px;height:34px;padding:6px;border-radius:8px;background:var(--c);color:var(--on-label)}
.ditem small{margin-left:auto;font-family:var(--font-mono);font-size:12px;text-transform:none;color:var(--fg-3);font-weight:500}
.ditem[aria-current="page"]{background:var(--surface);box-shadow:inset 4px 0 0 var(--c);font-weight:700}

/* sheet, toast */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:42;max-width:680px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top) - 24px);overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:16px 16px 0 0;padding:6px max(16px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s linear .32s}
.sheet.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.sheet-in{display:flex;flex-direction:column;gap:16px}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;position:sticky;top:-6px;background:var(--bg);z-index:1}
.sheet-head h2{margin:0;font-size:17px;font-weight:600;text-align:center}
.link{color:var(--accent);font-size:17px;padding:8px 0;justify-self:start}
.link.strong{font-weight:600;justify-self:end}
.sheet-title{display:flex;flex-direction:column;gap:6px}
.sheet-title h3{margin:0;font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--bg);text-decoration:underline;padding-left:8px;font-weight:600}

@media (min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.dc-g{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (min-width:900px){
  :root{--side:300px}
  .drawer{transform:none;visibility:visible;width:var(--side);transition:none}
  #dscrim,.dock,.avbtn{display:none}
  .page{padding-bottom:40px}
  .sheet{left:var(--side)}
  #toast{bottom:30px}
}
body[data-sec="study"]{--accent:var(--i-study);--accent-soft:var(--s-study);--label:var(--f-study)}
body[data-sec="todos"]{--accent:var(--i-todos);--accent-soft:var(--s-todos);--label:var(--f-todos)}
body[data-sec="calendar"]{--accent:var(--i-calendar);--accent-soft:var(--s-calendar);--label:var(--f-calendar)}
body[data-sec="ot"]{--accent:var(--i-ot);--accent-soft:var(--s-ot);--label:var(--f-ot)}
body[data-sec="roster"]{--accent:var(--i-roster);--accent-soft:var(--s-roster);--label:var(--f-roster)}
body[data-sec="cases"]{--accent:var(--i-cases);--accent-soft:var(--s-cases);--label:var(--f-cases)}
body[data-sec="nba"]{--accent:var(--i-nba);--accent-soft:var(--s-nba);--label:var(--f-nba)}
body[data-sec="backup"]{--accent:var(--i-backup);--accent-soft:var(--s-backup);--label:var(--f-backup)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-sec="today">
<header class="navbar"><div class="nb-in">
  <button class="avbtn" id="nb-av" type="button" data-act="drawer" aria-label="Open menu">S</button>
  <span class="nb-t" id="nb-title">Today</span>
  <span class="nb-r"><button class="iconbtn" id="nb-add" type="button" data-act="add" aria-label="Add entry"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></span>
</div></header>
<div id="banner"></div>
<main class="page" id="page"></main>
<nav class="dock" id="dock" aria-label="Main sections"></nav>
<aside class="drawer" id="drawer" aria-label="Sections"></aside>
<div class="scrim" id="dscrim" data-act="drawerclose"></div>
<div class="scrim" id="scrim" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-in" id="sheet-body"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="importFile" hidden>
<input type="file" id="privateFile" hidden>
<script>
'use strict';
const APP_VERSION = '2.0 · batch 2';
const KEY = 'studydesk.v1';
const DATA_FILES = ['cases', 'schedule', 'ot', 'nba'];

/* ---------- icons ---------- */
const IC = {
  today: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  study: '<path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5"/><path d="M8 7h7M8 11h5"/>',
  todos: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>',
  calendar: '<path d="M12 6.5C10 5 7 4.5 3.5 5v13.5c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5V20"/>',
  ot: '<path d="M14.5 6.5l3 3L9 18l-3-3z"/><path d="M13.5 5.5l5 5M16 8l3.5-3.5M18 3l3 3M7.5 16.5L3 21"/>',
  roster: '<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M6.5 9.5h8v3h-8zM6.5 15h4"/>',
  cases: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M7.5 14h2l1.5-3 2 5 1.5-2h2"/>',
  nba: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"/>',
  backup: '<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'
};
const svg = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const CHEV = '<svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5l5 5-5 5"/></svg>';
const SECS = {
  today: 'Today', study: 'Study', todos: 'To-do', calendar: 'Academics', ot: 'OT list',
  roster: 'Duty roster', cases: 'SLCM cases', nba: 'NBA', backup: 'Backup & settings'
};
const DOCK = ['today', 'study', 'todos', 'calendar', 'ot'];
const DOCK_LABEL = { today: 'Today', study: 'Study', todos: 'To-do', calendar: 'Acad', ot: 'OT' };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoOf(new Date());
const dayOf = isoStr => isoOf(new Date(isoStr));
const dt = s => new Date(s + 'T00:00:00');
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOWL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const dShort = s => +s.slice(8) + ' ' + MON[+s.slice(5, 7) - 1];
const dDow = s => DOW[(dt(s).getDay() + 6) % 7];
const dLong = s => { const d = dt(s); return DOWL[(d.getDay() + 6) % 7] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const daysUntil = s => Math.round((dt(s) - dt(today())) / 864e5);
const relDay = s => { const n = daysUntil(s); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : n > 1 ? 'In ' + n + ' days' : -n + ' days ago'; };
const ago = isoStr => { const n = -daysUntil(dayOf(isoStr)); return n <= 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'; };
const addDays = (s, n) => { const d = dt(s); d.setDate(d.getDate() + n); return isoOf(d); };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const byId = (arr, id) => arr.find(x => x.id === id);

/* ---------- personal data (on this phone) ---------- */
const banners = { save: null, info: null };
function blank() {
  return { version: 2, subjects: [], topics: [], log: [], todos: [], events: [], otDone: {}, private: null,
    settings: { backupLine: true, myName: '', countdownOn: true, examLabel: 'MD final exams', examDate: '2027-12-20', revisionsOn: true, intervals: [1, 3, 7, 14, 30] },
    meta: { lastExport: null, created: nowISO() } };
}
function normalise(s) {
  const b = blank();
  return { version: 2, subjects: s.subjects || [], topics: s.topics || [], log: s.log || [], todos: s.todos || [],
    events: s.events || [], otDone: s.otDone || {}, private: s.private || null,
    settings: { ...b.settings, ...(s.settings || {}) }, meta: { ...b.meta, ...(s.meta || {}) } };
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { banners.info = "This phone isn't letting the app store data right now, so changes won't be kept. Try opening the app from the home screen."; return blank(); }
  if (!raw) return blank();
  try { return normalise(JSON.parse(raw)); } catch (e) {
    try { localStorage.setItem(KEY + '.unreadable-' + Date.now(), raw); } catch (_) {}
    banners.info = "Your saved data couldn't be read, so the app started empty. A copy was kept aside. Use Backup → Restore to bring back your last backup.";
    return blank();
  }
}
let state = load();
function save() {
  try {
    const s = JSON.stringify(state);
    localStorage.setItem(KEY, s);
    if (localStorage.getItem(KEY) !== s) throw new Error('check failed');
    if (banners.save) { banners.save = null; renderBanner(); }
    return true;
  } catch (e) {
    banners.save = "Couldn't save. Your last change is only on screen and will be lost when the app closes. Try again, or export a backup from Backup & settings.";
    renderBanner(); return false;
  }
}
function commit(msg, undo) { const ok = save(); render(); if (ok && msg) toast(msg, undo); return ok; }

/* ---------- shared data (from the data folder on GitHub) ---------- */
const D = {}; const dataStatus = {};
DATA_FILES.forEach(f => {
  try { const c = JSON.parse(localStorage.getItem('studydesk.data.' + f) || 'null'); if (c) { D[f] = c.data; dataStatus[f] = { from: 'saved', at: c.at }; } } catch (_) {}
  if (!dataStatus[f]) dataStatus[f] = { from: 'none' };
});
async function loadData(manual) {
  let failed = 0;
  await Promise.all(DATA_FILES.map(async f => {
    try {
      const r = await fetch('data/' + f + '.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      D[f] = j; dataStatus[f] = { from: 'network', at: nowISO() };
      try { localStorage.setItem('studydesk.data.' + f, JSON.stringify({ at: nowISO(), data: j })); } catch (_) {}
    } catch (e) { failed++; if (dataStatus[f].from === 'network') dataStatus[f].from = 'saved'; }
  }));
  render();
  if (manual) toast(failed ? "Couldn't reach GitHub. Showing the last saved copy." : 'Up to date ✓');
}
const CASES = () => (D.cases && D.cases.items) || [];
const SCHED = () => (D.schedule && D.schedule.items) || [];
const SESSION_TIME = () => (D.schedule && D.schedule.sessionTime) || '';
const OTL = () => (D.ot && D.ot.items) || [];
const ROSTER = () => (state.private && state.private.roster && state.private.roster.days) || [];
const RCOLS = () => (state.private && state.private.roster && state.private.roster.cols) || [];
const presenters = k => (state.private && state.private.presenters && state.private.presenters[k]) || '';

/* ---------- roster helpers ---------- */
const cellHas = (cell, n) => cell.split('/').some(t => t.trim().toLowerCase() === n);
function dutiesFor(k) {
  const n = state.settings.myName.trim().toLowerCase();
  if (!n) return [];
  const r = ROSTER().find(x => x.date === k);
  return r ? r.p.map((c, i) => cellHas(c, n) ? RCOLS()[i] : null).filter(Boolean) : [];
}

/* ---------- study / revision ---------- */
function topicDays(id) { return [...new Set(state.log.filter(l => l.topicId === id).map(l => dayOf(l.date)))].sort(); }
function revStatus(t) {
  const days = topicDays(t.id); const iv = state.settings.intervals;
  if (!days.length) return { state: 'new' };
  const last = days[days.length - 1];
  if (days.length > iv.length) return { state: 'complete', last, step: days.length };
  const due = addDays(last, iv[days.length - 1]);
  return { state: due <= today() ? 'due' : 'scheduled', due, last, step: days.length };
}
function statusLine(st) {
  const total = state.settings.intervals.length;
  if (st.state === 'new') return 'Not studied yet';
  if (st.state === 'complete') return 'All ' + total + ' revisions done · last ' + ago(st.last + 'T12:00:00');
  if (st.state === 'due') return 'Ready to revise · last studied ' + ago(st.last + 'T12:00:00');
  return 'Next revision ' + dShort(st.due) + ' · revision ' + st.step + ' of ' + total;
}
const dueTopics = () => state.settings.revisionsOn ? state.topics.map(t => ({ t, st: revStatus(t) })).filter(x => x.st.state === 'due').sort((a, b) => a.st.due.localeCompare(b.st.due)) : [];

/* ---------- calendar items ---------- */
const KINDS = {
  acad: { label: 'Academic', color: 'var(--k-acad)' }, posting: { label: 'Posting', color: 'var(--k-posting)' },
  exam: { label: 'Exam', color: 'var(--k-exam)' }, duty: { label: 'Duty', color: 'var(--k-duty)' }, case: { label: 'Case', color: 'var(--k-case)' }
};
let REG = [];
const reg = it => (REG.push(it), REG.length - 1);
function itemsFor(k) {
  const out = [];
  SCHED().filter(x => x.date === k).forEach(x => out.push({ date: k, kind: x.kind in KINDS ? x.kind : 'acad', title: x.session, sub: x.topic || presenters(k), topic: x.topic, who: presenters(k), time: (SESSION_TIME().split(' ')[0] || '') + ' AM', src: 'Department program' }));
  dutiesFor(k).forEach(l => out.push({ date: k, kind: 'duty', title: 'Emergency duty', sub: l, time: 'Duty', src: 'Duty roster', role: l }));
  CASES().filter(c => c.date === k).forEach(c => out.push({ date: k, kind: 'case', title: c.procedure, sub: c.specialty + (c.or ? ' · ' + c.or : ''), time: 'Case', caseN: c.n }));
  state.events.filter(e => e.date === k).forEach(e => out.push({ date: k, kind: e.kind, title: e.text, sub: '', time: 'All day', evId: e.id }));
  return out;
}
function rowHTML(it, withDate) {
  const id = reg(it); const K = KINDS[it.kind] || KINDS.acad;
  const left = withDate ? `<span class="r-when"><b>${+it.date.slice(8)}</b><small>${dDow(it.date)}</small></span>` : `<span class="r-time">${esc(it.time)}</span>`;
  return `<button class="row" type="button" data-act="item" data-id="${id}"><span class="r-bar" style="--c:${K.color}"></span>${left}<span class="r-main"><span class="r-t">${esc(it.title)}</span>${it.sub ? `<span class="r-s">${esc(it.sub)}</span>` : ''}</span><span class="r-k" style="--c:${K.color}">${K.label}</span>${CHEV}</button>`;
}

/* ---------- UI state ---------- */
let tab = SECS[location.hash.slice(1)] ? location.hash.slice(1) : 'today';
const now0 = new Date();
let view = { y: now0.getFullYear(), m: now0.getMonth() };
let sel = today();
let rmode = 'mine', nbaSub = 'scores', nbaDay = null, otDay = null, showDone = false;
const collapsed = new Set();

/* ---------- pages ---------- */
const head = (title, sub, eyebrow) => `<div class="lt-wrap">${eyebrow ? `<span class="eyebrow">${esc(eyebrow)}</span>` : ''}<h1 class="lt">${esc(title)}</h1>${sub ? `<span class="lt-sub">${sub}</span>` : ''}</div>`;
const stat = (l, n, m) => `<div class="stat"><span class="s-l">${l}</span><span class="s-n">${n}</span>${m}</div>`;

function pageToday() {
  const t = today(); let h = head('Today', esc(dLong(t)), 'Study Desk');
  const up = SCHED().filter(x => x.date >= t).sort((a, b) => a.date.localeCompare(b.date))[0];
  if (up) {
    const id = reg({ date: up.date, kind: up.kind, title: up.session, topic: up.topic, who: presenters(up.date), src: 'Department program' });
    h += `<button class="card hero" type="button" data-act="item" data-id="${id}"><div class="c-top"><span class="c-lab">Up next · ${relDay(up.date)}</span><span class="c-m">${dDow(up.date)} ${dShort(up.date)}, 7:45 AM</span></div><span class="c-big">${esc(up.session)}</span>${up.topic ? `<span class="c-s">${esc(up.topic)}</span>` : ''}${presenters(up.date) ? `<span class="c-m">${esc(presenters(up.date))}</span>` : ''}</button>`;
  }
  const S = state.settings;
  if (S.countdownOn && S.examDate && daysUntil(S.examDate) >= 0) {
    const n = daysUntil(S.examDate);
    h += `<div class="card" style="--c:var(--k-exam)"><div class="c-top"><span class="c-lab">${esc(S.examLabel || 'Exam')}</span><span class="c-m">${esc(dLong(S.examDate))} ${dt(S.examDate).getFullYear()}</span></div><span class="c-t">${n === 0 ? 'Today' : plural(n, 'day') + ' to go'}</span></div>`;
  }
  if (S.revisionsOn) {
    const due = dueTopics();
    if (due.length) {
      h += `<button class="card" type="button" data-act="goto" data-tab="study" style="--c:var(--i-study)"><div class="c-top"><span class="c-lab">Ready to revise</span>${CHEV}</div><span class="c-t">${plural(due.length, 'topic')}</span><span class="c-s">${esc(due.slice(0, 3).map(x => x.t.name).join(' · '))}${due.length > 3 ? ' …' : ''}</span></button>`;
    } else if (state.topics.length) {
      const next = state.topics.map(x => revStatus(x)).filter(s => s.state === 'scheduled').sort((a, b) => a.due.localeCompare(b.due))[0];
      h += `<button class="card" type="button" data-act="goto" data-tab="study" style="--c:var(--i-study)"><div class="c-top"><span class="c-lab">Revision</span>${CHEV}</div><span class="c-s">Nothing to revise today.${next ? ' Next one on ' + dShort(next.due) + '.' : ''}</span></button>`;
    } else {
      h += `<button class="card" type="button" data-act="goto" data-tab="study" style="--c:var(--i-study)"><div class="c-top"><span class="c-lab">Study</span>${CHEV}</div><span class="c-s">Add your first subject and topics to start the revision schedule.</span></button>`;
    }
  }
  if (ROSTER().length) {
    if (!S.myName.trim()) {
      h += `<button class="card" type="button" data-act="goto" data-tab="roster" style="--c:var(--k-duty)"><span class="c-lab">Emergency duty</span><span class="c-s">Pick your name on the roster to see your duty days here.</span></button>`;
    } else {
      const nx = ROSTER().find(r => r.date >= t && dutiesFor(r.date).length);
      h += nx ? `<button class="card" type="button" data-act="goto" data-tab="roster" style="--c:var(--k-duty)"><div class="c-top"><span class="c-lab">Next duty · ${relDay(nx.date)}</span>${CHEV}</div><span class="c-t">${dDow(nx.date)} ${dShort(nx.date)}</span><span class="c-s">${esc(dutiesFor(nx.date).join(', '))}${nx.cover ? ' · Cover ' + esc(nx.cover) : ''}</span></button>`
        : `<button class="card" type="button" data-act="goto" data-tab="roster" style="--c:var(--k-duty)"><span class="c-lab">Emergency duty</span><span class="c-s">No upcoming duty found for ${esc(S.myName)} on the roster.</span></button>`;
    }
  }
  const od = otDefaultDay();
  if (od) {
    const rows = otRows(od); const n = rows.filter(r => state.otDone[r.id]).length;
    h += `<button class="card" type="button" data-act="goto" data-tab="ot" style="--c:var(--i-ot)"><div class="c-top"><span class="c-lab">OT list · ${relDay(od)}</span>${CHEV}</div><span class="c-t">${n} of ${plural(rows.length, 'case')} ticked</span><div class="track"><div class="fill" style="width:${rows.length ? n / rows.length * 100 : 0}%;background:var(--f-ot)"></div></div></button>`;
  }
  const items = itemsFor(t);
  const open = state.todos.filter(x => !x.done).length;
  h += `<div class="sec"><h2 class="sh">On today</h2><div class="group">${items.map(i => rowHTML(i)).join('')}${open ? `<button class="row" type="button" data-act="goto" data-tab="todos"><span class="r-bar" style="--c:var(--f-todos)"></span><span class="r-time">To-do</span><span class="r-main"><span class="r-t">${plural(open, 'open task')}</span></span>${CHEV}</button>` : ''}${!items.length && !open ? '<div class="row empty">Nothing on today. Tap + to add an entry.</div>' : ''}</div></div>`;
  const unsynced = CASES().filter(c => !c.synced).length; const pre = t.slice(0, 8);
  h += `<div class="sec"><h2 class="sh">At a glance</h2><div class="stats">
    ${stat('Cases logged', CASES().length, '<span class="s-m">On the case log</span>')}

    <label class="row field"><span class="f-l">Exam date</span><input type="date" data-setting="examDate" value="${esc(S.examDate)}"></label>

    <label class="row field"><span class="f-l">Revise after (days)</span><input type="text" inputmode="numeric" data-setting="intervals" value="${esc(S.intervals.join(', '))}"></label>
    <label class="row toggle"><span>Show last backup date in the menu</span><input type="checkbox" data-setting="backupLine" ${S.backupLine ? 'checked' : ''}></label>
  </div><p class="foot">No notifications are ever sent. Every section stays quiet until you open it.</p></div>`;
  h += `<div class="sec"><h2 class="sh">Storage</h2><div class="card"><span class="c-s" id="persistInfo">${esc(persistText)}</span>${standalone ? '' : '<span class="c-s">You\'re viewing this in Safari. Add it to your Home Screen and open it from there so the phone keeps your data.</span>'}<span class="c-m">Study Desk ${APP_VERSION} · ${plural(state.topics.length, 'topic')} · ${plural(state.log.length, 'session')} logged · ${plural(state.todos.length, 'task')}</span></div></div>`;
  return h;
}

/* ---------- render ---------- */
const PAGES = { today: pageToday, study: pageStudy, todos: pageTodos, calendar: pageCalendar, ot: pageOt, roster: pageRoster, cases: pageCases, nba: pageNba, backup: pageBackup };
function render() {
  REG = [];
  document.body.dataset.sec = tab;
  $('nb-title').textContent = SECS[tab];
  $('nb-add').style.visibility = (tab === 'today' || tab === 'calendar') ? 'visible' : 'hidden';
  const P = state.private && state.private.profile;
  $('nb-av').textContent = ((P && P.name) || 'S').slice(0, 1).toUpperCase();
  $('page').innerHTML = PAGES[tab]();
  $('dock').innerHTML = DOCK.map(k => `<button type="button" data-act="tab" data-tab="${k}" style="--c:var(--f-${k})" aria-label="${SECS[k]}"${k === tab ? ' aria-current="page"' : ''}>${svg(k)}<span>${DOCK_LABEL[k]}</span></button>`).join('');
  renderDrawer();
  if (tab === 'nba') { const s = $('nba-strip'), on = s && s.querySelector('[aria-pressed="true"]'); if (on) s.scrollLeft = on.offsetLeft - s.clientWidth / 2; }
}
function renderDrawer() {
  const P = state.private && state.private.profile; const due = dueTopics().length; const open = state.todos.filter(t => !t.done).length;
  const le = state.meta.lastExport;
  const item = (k, small) => `<button type="button" class="ditem" data-act="tab" data-tab="${k}" style="--c:var(--f-${k})"${k === tab ? ' aria-current="page"' : ''}>${svg(k)}${SECS[k]}${small ? `<small>${small}</small>` : ''}</button>`;
  $('drawer').innerHTML = `<div class="prof"><div class="av">${esc(((P && P.name) || 'S').slice(0, 1))}</div><div><b>${esc((P && P.name) || 'Study Desk')}</b><span>${esc(P ? [P.job, P.place].filter(Boolean).join(' · ') : 'Load your private file to add your name')}</span></div></div>
    <nav class="dnav"><p class="sh">Daily</p>${item('today')}<p class="sh">Study</p>${item('study', due ? due + ' due' : '')}${item('todos', open ? open + ' open' : '')}
    <p class="sh">Academics</p>${item('calendar')}${item('ot', OTL().length ? String(otRows(otDefaultDay() || '').length) : '')}${item('roster')}
    <p class="sh">Logbook</p>${item('cases')}<p class="sh">Leisure</p>${item('nba')}<p class="sh">App</p>${item('backup', state.settings.backupLine ? (le ? 'backup ' + ago(le) : 'no backup yet') : '')}</nav>`;
}
function renderBanner() {
  let h = '';
  if (banners.save) h += `<div class="banner"><span>${esc(banners.save)}</span></div>`;
  if (banners.info) h += `<div class="banner"><span>${esc(banners.info)}</span><button type="button" data-act="dismiss-info" aria-label="Dismiss">×</button></div>`;
  $('banner').innerHTML = h;
}
let toastTimer = null;
function toast(msg, undo) {
  const el = $('toast');
  el.innerHTML = esc(msg) + (undo ? '<button type="button" id="undoBtn">Undo</button>' : '');
  el.classList.add('show'); clearTimeout(toastTimer);
  if (undo) $('undoBtn').onclick = () => { undo(); el.classList.remove('show'); };
  toastTimer = setTimeout(() => el.classList.remove('show'), undo ? 5000 : 1800);
}
function goTab(k) { tab = k; history.replaceState(null, '', '#' + k); closeDrawer(); render(); window.scrollTo(0, 0); }
function openDrawer() { $('drawer').classList.add('open'); $('dscrim').classList.add('open'); }
function closeDrawer() { $('drawer').classList.remove('open'); $('dscrim').classList.remove('open'); }

/* ---------- sheets ---------- */
function openSheet(html) { $('sheet-body').innerHTML = html; $('sheet').scrollTop = 0; $('sheet').classList.add('open'); $('scrim').classList.add('open'); document.body.classList.add('locked'); }
function closeSheet() { $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); document.body.classList.remove('locked'); }
const sheetOpen = () => $('sheet').classList.contains('open');
const kv = (l, v) => `<div class="row kv"><span class="r-l">${l}</span><span class="r-v">${v}</span></div>`;
const sheetHead = (title, left) => `<div class="sheet-head">${left || '<span></span>'}<h2>${esc(title)}</h2><button class="link strong" type="button" data-act="close">Done</button></div>`;
function focusFirst() { setTimeout(() => { const f = $('sheet').querySelector('[data-autofocus]'); if (f) f.focus(); }, 60); }

let addKind = 'acad';
function addEventSheet() {
  openSheet(`<form data-form="event" class="sheet-in" autocomplete="off"><div class="sheet-head"><button type="button" class="link" data-act="close">Cancel</button><h2>New entry</h2><button type="submit" class="link strong">Add</button></div>
    <div class="group"><label class="row field"><span class="f-l">Title</span><input class="left" name="text" maxlength="80" placeholder="Cardiac OT, theory test" required data-autofocus></label>
    <label class="row field"><span class="f-l">Date</span><input name="date" type="date" required value="${sel || today()}"></label></div>
    <div class="sec"><h3 class="sh">Type</h3><div class="seg">${['acad', 'posting', 'exam', 'duty'].map(k => `<button type="button" data-act="akind" data-k="${k}" aria-pressed="${k === addKind}">${KINDS[k].label}</button>`).join('')}</div></div>
    <p class="foot">Entries you add stay on this phone and are included in your backup.</p></form>`);
  focusFirst();
}
function itemSheet(it) {
  if (it.kind === 'case') return caseSheet(it.caseN);
  let rows = kv('Date', esc(dLong(it.date)) + `<br><span class="muted" style="font-size:13px">${relDay(it.date)}</span>`);
  if (it.src === 'Department program' && SESSION_TIME()) rows += kv('Time', esc(SESSION_TIME()));
  rows += kv('Type', `<span style="color:${(KINDS[it.kind] || KINDS.acad).color};font-weight:600">${(KINDS[it.kind] || KINDS.acad).label}</span>`);
  if (it.who) rows += kv('Presenters', esc(it.who));
  if (it.role) rows += kv('Role', esc(it.role));
  if (it.kind === 'duty' && it.src) { const r = ROSTER().find(x => x.date === it.date); if (r && r.cover) rows += kv('Cover', esc(r.cover)); }
  rows += kv('Source', it.evId ? 'Added by you' : esc(it.src || ''));
  openSheet(`${sheetHead('Details')}<div class="sheet-title"><h3>${esc(it.title)}</h3>${it.topic ? `<span class="c-s">${esc(it.topic)}</span>` : ''}</div><div class="group">${rows}</div>${it.evId ? `<button class="btn danger wide" type="button" data-act="del-event" data-id="${it.evId}">Delete entry</button>` : ''}`);
}
function caseSheet(n) {
  const c = CASES().find(x => x.n === n); if (!c) return;
  const nr = v => v ? esc(v) : '<span class="muted">Not recorded</span>';
  openSheet(`${sheetHead('Case ' + c.n)}<div class="sheet-title"><span class="pill ${c.synced ? 'good' : 'warn'}">${c.synced ? 'Synced to SLCM' : 'Not synced to SLCM yet'}</span><h3>${esc(c.procedure)}</h3><span class="muted">${esc(dLong(c.date))}</span></div>
    <div class="group">${kv('Specialty', nr(c.specialty))}${kv('ASA grade', nr(c.asa))}${kv('Urgency', nr(c.urgency))}</div>
    <div class="group">${kv('Anaesthesia', nr(c.type))}${kv('Plan', nr(c.plan))}${kv('OR', nr(c.or))}${kv('Consultant', nr(c.consultant))}</div>
    <p class="foot">Hospital ID is kept in your logbook spreadsheet only.</p>`);
}
function subjectSheet(id) {
  const s = id ? byId(state.subjects, id) : null;
  openSheet(`<form data-form="subject" data-id="${id || ''}" class="sheet-in" autocomplete="off"><div class="sheet-head"><button type="button" class="link" data-act="close">Cancel</button><h2>${s ? 'Edit subject' : 'New subject'}</h2><button type="submit" class="link strong">Save</button></div>
    <input class="tin" name="name" value="${esc(s && s.name)}" maxlength="80" required placeholder="e.g. Cardiac anaesthesia" data-autofocus></form>
    ${s ? `<button class="btn danger wide" type="button" data-act="delete-subject" data-id="${id}">Delete subject</button>` : ''}`);
  focusFirst();
}
function topicEditSheet(id, subjectId) {
  const t = id ? byId(state.topics, id) : null;
  openSheet(`<form data-form="topic" data-id="${id || ''}" data-subject="${subjectId || (t && t.subjectId) || ''}" class="sheet-in" autocomplete="off"><div class="sheet-head"><button type="button" class="link" data-act="${t ? 'open-topic' : 'close'}" data-id="${id || ''}">Cancel</button><h2>${t ? 'Edit topic' : 'New topic'}</h2><button type="submit" class="link strong">Save</button></div>
    <input class="tin" name="name" value="${esc(t && t.name)}" maxlength="120" required placeholder="Topic, e.g. Aortic stenosis" data-autofocus>
    <input class="tin" name="pointer" value="${esc(t && t.pointer)}" maxlength="80" placeholder="Where your notes are (optional): GoodNotes › Cardiac › p. 40"></form>
    ${t ? `<button class="btn danger wide" type="button" data-act="delete-topic" data-id="${id}">Delete topic</button>` : ''}`);
  focusFirst();
}
function topicSheet(id) {
  const t = byId(state.topics, id); if (!t) return closeSheet();
  const s = byId(state.subjects, t.subjectId); const st = revStatus(t);
  const entries = state.log.filter(l => l.topicId === id).sort((a, b) => b.date.localeCompare(a.date));
  openSheet(`<div class="sheet-head"><button type="button" class="link" data-act="edit-topic" data-id="${id}">Edit</button><h2>Topic</h2><button class="link strong" type="button" data-act="close">Done</button></div>
    <div class="sheet-title"><span class="c-lab">${esc(s ? s.name : '')}</span><h3>${esc(t.name)}</h3>${t.pointer ? `<span class="muted">📓 ${esc(t.pointer)}</span>` : ''}${state.settings.revisionsOn ? `<span class="pill acc">${esc(statusLine(st))}</span>` : ''}</div>
    <form data-form="mark" data-id="${id}" class="sheet-in" style="gap:8px"><input class="tin" name="note" maxlength="140" autocomplete="off" placeholder="One-line note (optional)"><button class="btn wide" type="submit">${st.state === 'new' ? 'Mark studied today' : 'Log study session today'}</button></form>
    <div class="sec"><h3 class="sh">History</h3>${entries.length ? `<div class="group">${entries.slice(0, 40).map(l => `<div class="rowwrap"><div class="row"><span class="r-main"><span class="r-t" style="font-size:15px">${esc(dShort(dayOf(l.date)))} ${dt(dayOf(l.date)).getFullYear()}</span>${l.note ? `<span class="r-s">${esc(l.note)}</span>` : ''}</span></div><button class="xbtn" type="button" data-act="del-log" data-id="${l.id}" aria-label="Remove entry">×</button></div>`).join('')}</div>` : '<p class="foot">Nothing logged yet.</p>'}</div>`);
}

/* ---------- actions ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act) {
    case 'tab': case 'goto': closeSheet(); goTab(b.dataset.tab); break;
    case 'drawer': openDrawer(); break;
    case 'drawerclose': closeDrawer(); break;
    case 'close': closeSheet(); break;
    case 'dismiss-info': banners.info = null; renderBanner(); break;
    case 'add': addEventSheet(); break;
    case 'akind': addKind = b.dataset.k; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); break;
    case 'item': itemSheet(REG[+id]); break;
    case 'case': caseSheet(+b.dataset.n); break;
    case 'day': sel = b.dataset.k; render(); break;
    case 'month': view.m += +b.dataset.d; if (view.m < 0) { view.m = 11; view.y--; } if (view.m > 11) { view.m = 0; view.y++; } render(); break;
    case 'rmode': rmode = b.dataset.m; render(); break;
    case 'nsub': nbaSub = b.dataset.s; render(); break;
    case 'nday': nbaDay = b.dataset.d; render(); break;
    case 'otday': otDay = b.dataset.d; render(); break;
    case 'ot-tick': if (state.otDone[id]) delete state.otDone[id]; else state.otDone[id] = nowISO(); commit(); break;
    case 'del-event': {
      const idx = state.events.findIndex(x => x.id === id); if (idx < 0) return; const [rm] = state.events.splice(idx, 1);
      closeSheet(); commit('Entry deleted', () => { state.events.splice(idx, 0, rm); commit(); }); break; }
    case 'add-subject': subjectSheet(null); break;
    case 'edit-subject': subjectSheet(id); break;
    case 'toggle-subject': collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); render(); break;
    case 'delete-subject': {
      const s = byId(state.subjects, id); const tids = state.topics.filter(t => t.subjectId === id).map(t => t.id);
      const nl = state.log.filter(l => tids.includes(l.topicId)).length;
      if (!confirm(`Delete “${s.name}”, its ${plural(tids.length, 'topic')} and ${plural(nl, 'logged session')}? This can't be undone.`)) return;
      state.subjects = state.subjects.filter(x => x.id !== id); state.topics = state.topics.filter(t => t.subjectId !== id); state.log = state.log.filter(l => !tids.includes(l.topicId));
      closeSheet(); commit('Subject deleted'); break; }
    case 'add-topic': topicEditSheet(null, id); break;
    case 'open-topic': topicSheet(id); break;
    case 'edit-topic': topicEditSheet(id); break;
    case 'delete-topic': {
      const t = byId(state.topics, id); const nl = state.log.filter(l => l.topicId === id).length;
      if (!confirm(`Delete “${t.name}” and its ${plural(nl, 'logged session')}? This can't be undone.`)) return;
      state.topics = state.topics.filter(x => x.id !== id); state.log = state.log.filter(l => l.topicId !== id);
      closeSheet(); commit('Topic deleted'); break; }
    case 'revise': {
      const entry = { id: uid(), topicId: id, date: nowISO(), note: 'Revision' }; state.log.push(entry);
      commit('Revision logged ✓', () => { state.log = state.log.filter(l => l.id !== entry.id); commit(); }); break; }
    case 'del-log': {
      const idx = state.log.findIndex(l => l.id === id); if (idx < 0) return; const [rm] = state.log.splice(idx, 1);
      commit('Entry removed', () => { state.log.push(rm); commit(); if (sheetOpen()) topicSheet(rm.topicId); });
      topicSheet(rm.topicId); break; }
    case 'toggle-todo': { const t = byId(state.todos, id); t.done = !t.done; t.doneAt = t.done ? nowISO() : null; commit(t.done ? 'Done ✓' : null); break; }
    case 'del-todo': {
      const idx = state.todos.findIndex(t => t.id === id); if (idx < 0) return; const [rm] = state.todos.splice(idx, 1);
      commit('Task deleted', () => { state.todos.splice(idx, 0, rm); commit(); }); break; }
    case 'toggle-done': showDone = !showDone; render(); break;
    case 'clear-done': {
      const gone = state.todos.filter(t => t.done); state.todos = state.todos.filter(t => !t.done);
      commit(plural(gone.length, 'done task') + ' cleared', () => { state.todos = state.todos.concat(gone); commit(); }); break; }
    case 'export': exportData(); break;
    case 'import': $('importFile').click(); break;
    case 'import-private': $('privateFile').click(); break;
    case 'remove-private':
      if (!confirm('Remove the roster and presenter names from this phone? You can load the file again any time.')) return;
      state.private = null; commit('Private file removed'); break;
    case 'refresh': loadData(true); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fd = new FormData(f); const id = f.dataset.id;
  switch (f.dataset.form) {
    case 'event': {
      const text = (fd.get('text') || '').trim(), date = fd.get('date'); if (!text || !date) return;
      state.events.push({ id: uid(), date, kind: addKind, text }); sel = date; closeSheet(); commit('Entry added'); break; }
    case 'subject': {
      const name = (fd.get('name') || '').trim(); if (!name) return;
      if (id) byId(state.subjects, id).name = name; else state.subjects.push({ id: uid(), name, created: nowISO() });
      closeSheet(); commit(id ? 'Saved' : 'Subject added'); break; }
    case 'topic': {
      const name = (fd.get('name') || '').trim(), pointer = (fd.get('pointer') || '').trim(); if (!name) return;
      if (id) { const t = byId(state.topics, id); t.name = name; t.pointer = pointer; commit('Saved'); topicSheet(id); }
      else { state.topics.push({ id: uid(), subjectId: f.dataset.subject, name, pointer, created: nowISO() }); collapsed.delete(f.dataset.subject); closeSheet(); commit('Topic added'); }
      break; }
    case 'mark': {
      state.log.push({ id: uid(), topicId: id, date: nowISO(), note: (fd.get('note') || '').trim() });
      commit('Logged ✓'); topicSheet(id); break; }
    case 'todo': {
      const text = (fd.get('text') || '').trim(); if (!text) return;
      state.todos.push({ id: uid(), text, done: false, created: nowISO(), doneAt: null }); commit();
      const inp = document.querySelector('form[data-form="todo"] input'); if (inp) inp.focus(); break; }
  }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.setting; if (!k) return;
  const S = state.settings; const el = e.target;
  if (el.type === 'checkbox') S[k] = el.checked;
  else if (k === 'intervals') {
    const nums = String(el.value).split(/[,\s]+/).filter(Boolean).map(Number);
    if (!nums.length || nums.length > 10 || nums.some(n => !Number.isInteger(n) || n < 1 || n > 365)) { toast("Couldn't read that. Use whole days, e.g. 1, 3, 7, 14, 30"); render(); return; }
    S.intervals = nums;
  } else S[k] = el.value;
  commit('Saved');
});

/* ---------- backup ---------- */
async function exportData() {
  const name = `study-desk-backup-${today()}.json`;
  const json = JSON.stringify({ app: 'study-desk', exportedAt: nowISO(), ...state }, null, 1);
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: name });
    else { const url = URL.createObjectURL(file); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); }
    state.meta.lastExport = nowISO(); commit('Backup file ready ✓');
  } catch (e) {
    if (e && e.name === 'AbortError') toast('Backup cancelled. No file was made.');
    else { banners.info = "Couldn't create the backup file (" + ((e && e.message) || 'unknown error') + '). Nothing on the phone was changed.'; renderBanner(); }
  }
}
async function readJsonFile(input) {
  const f = input.files && input.files[0]; input.value = ''; if (!f) return null;
  try { return JSON.parse(await f.text()); } catch (_) { banners.info = "That file couldn't be read. Nothing was changed."; renderBanner(); return null; }
}
$('importFile').addEventListener('change', async e => {
  const data = await readJsonFile(e.target); if (!data) return;
  if (data.app === 'study-desk-private') { return applyPrivate(data); }
  if (data.app !== 'study-desk' || !Array.isArray(data.subjects)) { banners.info = "That file doesn't look like a Study Desk backup. Nothing was changed."; return renderBanner(); }
  const n = `${(data.subjects || []).length} subjects, ${(data.topics || []).length} topics, ${(data.log || []).length} sessions, ${(data.todos || []).length} tasks`;
  if (!confirm(`Replace everything on this phone with this backup?\n\nBackup has: ${n}\nMade on: ${data.exportedAt ? dShort(dayOf(data.exportedAt)) : 'unknown date'}\n\nWhat's on the phone now will be replaced.`)) return;
  const prev = state; state = normalise(data);
  if (save()) { collapsed.clear(); render(); toast('Backup restored ✓'); } else { state = prev; render(); }
});
$('privateFile').addEventListener('change', async e => { const data = await readJsonFile(e.target); if (data) applyPrivate(data); });
function applyPrivate(data) {
  if (data.app !== 'study-desk-private') { banners.info = "That isn't a Study Desk private file. Nothing was changed."; return renderBanner(); }
  const prev = state.private; state.private = { updated: data.updated, profile: data.profile || null, roster: data.roster || null, presenters: data.presenters || {} };
  if (!commit('Private file loaded ✓')) { state.private = prev; render(); }
}
async function checkPersist() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      const p = (await navigator.storage.persisted()) || (await navigator.storage.persist());
      persistText = p ? 'This phone has agreed to keep the app’s data (persistent storage is on).' : 'This phone hasn’t promised to keep the data long-term. An occasional backup is your safety net.';
    } else persistText = 'This phone gives no storage guarantee here. An occasional backup is your safety net.';
  } catch (_) { persistText = 'Couldn’t check storage status. An occasional backup is your safety net.'; }
  const el = $('persistInfo'); if (el) el.textContent = persistText;
}

/* ---------- start ---------- */
renderBanner(); render(); checkPersist(); loadData(false);
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (SECS[k] && k !== tab) { tab = k; closeDrawer(); render(); window.scrollTo(0, 0); } });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadData(false); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
